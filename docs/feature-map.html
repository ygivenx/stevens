<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stevens feature map</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e3e0;
--planned:#e0e0e6;--deferred:#b8b8bd;--stub:#d9534f;--api-only:#e8a33d;--beta:#4a7fd4;--pending:#36a3a3;--stable:#3a9d5d;
--pass:#3a9d5d;--fail:#d9534f;--partial:#e8a33d;--skip:#9a9aa0}
@media (prefers-color-scheme:dark){:root{--bg:#151517;--card:#1f1f22;--ink:#ececee;--mute:#9a9aa2;--line:#2f2f34}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:18px 24px 8px}h1{margin:0 0 4px;font-size:20px}.sub{color:var(--mute);font-size:13px}
.sub p,.sub ul{margin:2px 0}.sub ul{padding-left:18px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 6px;background:var(--line)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:2px 10px;cursor:pointer;user-select:none;font-size:12px;color:var(--ink)}
.chip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.chip.off{opacity:.35}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:4px 24px 10px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.controls input{padding:6px 10px;border:1px solid var(--line);border-radius:6px;width:260px;background:var(--card);color:var(--ink)}
.group{display:flex;gap:5px;align-items:center}.group b{font-size:12px;color:var(--mute);font-weight:600;margin-right:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;padding:14px 24px 40px}
@media (max-width:1100px){main{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tab{padding:5px 12px;border-radius:6px;cursor:pointer;border:1px solid var(--line);background:var(--card)}
.tab.on{background:var(--ink);color:var(--bg)}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.area{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.area h2{margin:0;font-size:15px;cursor:pointer}.area h2:hover{text-decoration:underline}
.area .meta{color:var(--mute);font-size:12px;margin:2px 0 6px}
.area .bar{height:8px;margin:6px 0 8px}
.tiles{display:flex;flex-wrap:wrap;gap:4px}
.tile{width:22px;height:22px;border-radius:4px;cursor:pointer;position:relative;border:2px solid transparent}
.tile.notdriven{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.45) 0 3px,transparent 3px 6px)}
.tile.failed::after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--fail);border:1.5px solid var(--card)}
.tile.dim{opacity:.12}.tile.hit{border-color:var(--ink)}.tile.sel{outline:3px solid var(--ink);outline-offset:1px}
.tile:hover{transform:scale(1.15)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.panel h3{margin:0 0 4px;font-size:16px}.panel h4{margin:14px 0 4px;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;color:#fff;font-size:12px;font-weight:600}
.kv{display:grid;grid-template-columns:90px 1fr;gap:3px 10px;font-size:13px;margin-top:8px}.kv div:nth-child(odd){color:var(--mute)}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(127,127,127,.13);padding:0 3px;border-radius:3px;word-break:break-word}
pre{font:12px ui-monospace,Menlo,monospace;background:rgba(127,127,127,.1);padding:8px;border-radius:6px;overflow:auto;white-space:pre}
.gotcha{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:8px 0;font-size:13px}.gotcha p,.gotcha ul{margin:2px 0}
.gotcha.hit{border-left-color:var(--fail)}.gotcha.near{border-left-color:var(--api-only)}
ul,ol{padding-left:20px;margin:4px 0}
.journeys{display:flex;flex-direction:column;gap:8px}
.journey{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center}
.journey.on{outline:2px solid var(--ink)}.journey .n{color:var(--mute);font-size:12px}
.matrix{border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;width:100%}
.matrix th,.matrix td{border:1px solid var(--line);padding:6px 8px;text-align:center;font-size:13px}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix td.c{cursor:pointer;font-weight:600}
.trow{display:flex;gap:8px;font-size:12px;border-bottom:1px solid var(--line);padding:2px 0}.trow span{flex:1}
.empty{color:var(--mute)}
a.link{color:inherit;cursor:pointer;text-decoration:underline dotted}
</style></head><body>

<script>
const D = {"areas": [{"file": "capture.md", "title": "Capture", "last_verified": "uncommitted on 2026-10-26 (source)", "intro": "<p>Capture stages what Stevens reasons over: Ray-Ban Meta glasses captures (a staged ~90s conference talk, a slide photo, article highlights) into the personal vault, and the fictional Helios deal data (deck photo, CRM record, memos) into the enterprise vault. Fixtures live in the server-only <code>fixtures/<\/code> directory and reach the browser only through the policy-checked media route. Day 1 proves both perception gates with live calls; day 2 commits the final fixtures. Overall maturity: everything planned.<\/p>", "subs": [{"id": "capture-talk-audio", "what": "Staged ~90s two-voice talk transcribes via Voice batch with speaker labels and timestamps into the personal vault", "what_text": "Staged ~90s two-voice talk transcribes via Voice batch with speaker labels and timestamps into the personal vault", "maturity": "planned", "surface": "UI+API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Fixtures, SPEC.md \u00a7 Models", "driving": "<ul><li><b>capture-talk-audio<\/b>: seed then read the transcript \u2192 <code>stevensctl seed &amp;&amp; stevensctl api --as Associate capture talk --expect 200 --field &#x27;.speakers&#x27;<\/code> \u2192 transcript with 2 speakers and timestamp anchors.<\/li><\/ul>", "notes": ""}, {"id": "capture-slide-photo", "what": "Glasses slide photo reads to verbatim text via Spark vision at low effort, stored for Fact checks", "what_text": "Glasses slide photo reads to verbatim text via Spark vision at low effort, stored for Fact checks", "maturity": "planned", "surface": "UI+API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Fixtures, SPEC.md \u00a7 Models", "driving": "<ul><li><b>capture-slide-photo<\/b>: seed then read the slide text \u2192 <code>stevensctl api --as Associate capture slide --expect 200 --field &#x27;.text&#x27;<\/code> \u2192 verbatim slide text.<\/li><\/ul>", "notes": ""}, {"id": "capture-articles", "what": "3 article highlights land in the personal vault as text claims", "what_text": "3 article highlights land in the personal vault as text claims", "maturity": "planned", "surface": "UI+API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Fixtures", "driving": "<ul><li><b>capture-articles<\/b>: seed then list personal sources \u2192 <code>stevensctl api --as Associate vault personal --expect 200 --field &#x27;.sources&#x27;<\/code> \u2192 talk, slide, and 3 articles.<\/li><\/ul>", "notes": ""}, {"id": "capture-enterprise", "what": "Helios deal + CRM record, deck photo, team memo, partner-only conflicts memo, and one wall item seed the enterprise vault", "what_text": "Helios deal + CRM record, deck photo, team memo, partner-only conflicts memo, and one wall item seed the enterprise vault", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Fixtures, SPEC.md \u00a7 Contracts", "driving": "<ul><li><b>capture-enterprise<\/b>: seed then list enterprise sources \u2192 <code>stevensctl api --as Partner vault enterprise --expect 200 --field &#x27;.sources&#x27;<\/code> \u2192 deal, CRM, deck, memos, and the wall item.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>The Voice endpoint, upload format, and timestamp/speaker response shape are unknown until the day 1 spike, and the client signature is designed after it (SPEC.md \u00a7 Meta API wiring).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Glasses-mic audio of a distant speaker may transcribe poorly; the fallback is phone audio near the speaker with glasses video (SPEC.md \u00a7 Non-goals and risks).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Captures are pre-recorded files, not streamed; live glasses streaming via the Device Access Toolkit is out of scope (SPEC.md \u00a7 Fixtures).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>SAM 3.1 screen-cropping is built only if day 1 shows Spark misreads the uncropped photo (SPEC.md \u00a7 Models).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li><code>Source.fixture<\/code> is a path under the server-only <code>fixtures/<\/code> directory, never <code>public/<\/code> and never a blob URL; media reaches the browser only through <code>GET /api/media/:sourceId<\/code> (SPEC.md \u00a7 Contracts).<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>Planned UI; no build exists yet. Intended path:<\/p><ol><li>Open the app at <code>http://localhost:5173<\/code>.<\/li><li>Choose \"Capture\".<\/li><li>See the talk transcript appear with speaker labels and timestamps, the slide text, and the vault lists.<\/li><\/ol>", "scope": "Glasses captures and fixtures into the two vaults", "roles": "all", "overall": "planned"}, {"file": "extraction.md", "title": "Extraction", "last_verified": "uncommitted on 2026-10-26 (source)", "intro": "<p>Extraction turns captured text (transcripts, photo text, documents) into structured claims via Spark at low effort with JSON output, and the runtime citation resolver guards everything Stevens displays: every sentence needs a citation, Fact quotes must be verbatim, and failing sentences are dropped and counted. Day 3 build. Overall maturity: everything planned.<\/p>", "subs": [{"id": "extraction-claims", "what": "Transcript and photo text become structured claims (entity, metric, value, verbatim quote, timestamp, speaker)", "what_text": "Transcript and photo text become structured claims (entity, metric, value, verbatim quote, timestamp, speaker)", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Models, SPEC.md \u00a7 Contracts", "driving": "<ul><li><b>extraction-claims<\/b>: seed then extract \u2192 <code>stevensctl seed &amp;&amp; stevensctl api --as Associate extract talk --expect 200 --field &#x27;.claims[0].quote&#x27;<\/code> \u2192 claims with verbatim quotes and speaker anchors.<\/li><\/ul>", "notes": ""}, {"id": "extraction-resolver", "what": "Every displayed sentence resolves \u22651 citation; Fact quotes are verbatim substrings; unsupported sentences are dropped and counted", "what_text": "Every displayed sentence resolves \u22651 citation; Fact quotes are verbatim substrings; unsupported sentences are dropped and counted", "maturity": "planned", "surface": "UI+API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Server components", "driving": "<ul><li><b>extraction-resolver<\/b>: inject a fake quote then render \u2192 <code>stevensctl api --as Associate resolver probe --expect 200 --field &#x27;.droppedSentences&#x27;<\/code> \u2192 unsupported sentence dropped and counted as 1.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li><code>Claim.quote<\/code> must be a verbatim substring of its source's <code>text<\/code>; <code>at<\/code> and <code>speaker<\/code> come from Voice timestamps and speaker labels (SPEC.md \u00a7 Contracts).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>A Fact's quote must resolve against the claim and the claim's quote against the source text; the resolver drops failures from the draft but counts them for the inspector (\"1 unsupported sentence removed\") (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Stevens says \"nothing relevant\" rather than inventing when no claim resolves (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>The cheaper <code>muse-spark-1.3-contributor<\/code> tier is tried for extraction during the day-1 A/B and kept if quality holds (SPEC.md \u00a7 Models).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Every structured response is validated against a zod schema, retried once, then fails closed (SPEC.md \u00a7 Architecture).<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>Planned UI; no build exists yet. Intended path:<\/p><ol><li>Open the app at <code>http://localhost:5173<\/code>.<\/li><li>Choose a source in \"Capture\".<\/li><li>See its extracted claims with quotes linked back to the source text.<\/li><\/ol>", "scope": "Transcript/photo text to structured claims + citation resolver", "roles": "all", "overall": "planned"}, {"file": "ledger.md", "title": "Ledger", "last_verified": "uncommitted on 2026-10-26 (source)", "intro": "<p>The ledger is the append-only event log at <code>data/ledger.jsonl<\/code> (gitignored) recording the whole pipeline (<code>source.ingested<\/code> through <code>draft.approved<\/code>), with every real model call logging its model, response ID, usage, and stage key inside its event. Every stage call has a stage key and is reused if it already completed; events are appended before the UI hears of them; a crash resumes with no repeated paid call; replay never re-calls the API. Day 2 build. Overall maturity: everything planned.<\/p>", "subs": [{"id": "ledger-events", "what": "Every pipeline step appends a typed event; real calls log model, response ID, usage, and stage key in theirs; failed attempts log usage too", "what_text": "Every pipeline step appends a typed event; real calls log model, response ID, usage, and stage key in theirs; failed attempts log usage too", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Server components, SPEC.md \u00a7 Contracts", "driving": "<ul><li><b>ledger-events<\/b>: drive the demo path then read the log \u2192 <code>stevensctl browser run brief &amp;&amp; stevensctl api --as Associate ledger --expect 200 --field &#x27;.events&#x27;<\/code> \u2192 typed events with model, response ID, usage, and stage key on real calls.<\/li><\/ul>", "notes": ""}, {"id": "ledger-resume", "what": "A crash or API error resumes from the last completed stage, so no completed paid call repeats", "what_text": "A crash or API error resumes from the last completed stage, so no completed paid call repeats", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Server components, SPEC.md \u00a7 Validation", "driving": "<ul><li><b>ledger-resume<\/b>: kill the server mid-pipeline and restart \u2192 <code>stevensctl stack restart<\/code> mid-run then <code>stevensctl meta calls<\/code> \u2192 counter shows no repeated paid call.<\/li><\/ul>", "notes": ""}, {"id": "ledger-replay", "what": "A refresh replays the same brief, answer, and inspector from the ledger with zero new API calls", "what_text": "A refresh replays the same brief, answer, and inspector from the ledger with zero new API calls", "maturity": "planned", "surface": "UI+API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Server components, SPEC.md \u00a7 Validation", "driving": "<ul><li><b>ledger-replay<\/b>: reload and count API calls \u2192 <code>stevensctl meta calls<\/code> before and after a refresh \u2192 counter unchanged, same brief and inspector.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>Model IDs in logged events must appear in <code>GET /v1/models<\/code>, so the 1.3 \u2192 1.2 \u2192 1.1 fallback still validates (SPEC.md \u00a7 Meta API wiring).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>A stage key hashes stage, source IDs, prompt version, and model; the server reuses a completed event with that key before calling (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>On a missing key or API error the app uses the cached fixture response with a visible <code>Simulated \u2014 &lt;reason&gt;<\/code> badge, and the boundary never degrades (SPEC.md \u00a7 Meta API wiring).<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>No user path: the ledger is infrastructure. Its visible surface is the inspector and the replay behavior on refresh.<\/p>", "scope": "Durable pipeline ledger + replay", "roles": "all", "overall": "planned"}, {"file": "server.md", "title": "Server", "last_verified": "uncommitted on 2026-10-26 (source)", "intro": "<p>The server owns the boundary: a Hono app on :8787 holds the vaults, policy, assembler, pipeline, ledger, and every Meta call, and the browser receives only viewer-filtered JSON. <code>MODEL_API_KEY<\/code> exists only in <code>.env.local<\/code> and the server process. The Vite UI on :5173 proxies <code>/api<\/code> to the server and adds no key; <code>npm start<\/code> serves the built UI from the server. Day 1 scaffolds it; day 2 wires state and events. Overall maturity: everything planned.<\/p>", "subs": [{"id": "server-state", "what": "GET /api/state returns the viewer-filtered ledger projection for the X-Viewer-Role caller", "what_text": "GET /api/state returns the viewer-filtered ledger projection for the X-Viewer-Role caller", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Stevens API", "driving": "<ul><li><b>server-state<\/b>: read state as each role \u2192 <code>stevensctl api --as Associate state --expect 200 --field &#x27;.drafts&#x27;<\/code> then <code>--as Partner<\/code> \u2192 each sees only its own projection with no leaked text or media.<\/li><\/ul>", "notes": ""}, {"id": "server-actions", "what": "POST ingest, ask, release, approve, and reject run the pipeline and gates for the calling viewer", "what_text": "POST ingest, ask, release, approve, and reject run the pipeline and gates for the calling viewer", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Stevens API", "driving": "<ul><li><b>server-actions<\/b>: ask then approve \u2192 <code>stevensctl api --as Associate ask --expect 200<\/code> then <code>stevensctl api --as Partner approve &lt;draftId&gt; --expect 200<\/code> \u2192 answer drafts, then the decision logs.<\/li><\/ul>", "notes": ""}, {"id": "server-media", "what": "GET /api/media/:sourceId serves fixture media only after a policy check; fixtures are never served statically", "what_text": "GET /api/media/:sourceId serves fixture media only after a policy check; fixtures are never served statically", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Stevens API, SPEC.md \u00a7 Contracts", "driving": "<ul><li><b>server-media<\/b>: fetch media as each role \u2192 <code>stevensctl api --as Associate media &lt;sourceId&gt; --expect 200<\/code> \u2192 bytes for allowed sources, rejection for withheld ones; no fixture URL works outside this route.<\/li><\/ul>", "notes": ""}, {"id": "server-events", "what": "GET /api/events streams pipeline progress over server-sent events", "what_text": "GET /api/events streams pipeline progress over server-sent events", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Architecture", "driving": "<ul><li><b>server-events<\/b>: watch a run \u2192 <code>stevensctl api --as Associate events --until &#x27;.stage == drafted&#x27;<\/code> \u2192 transcribing through drafting stages arrive in order.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>The browser calls only Stevens' own <code>/api/*<\/code>, never Meta (SPEC.md \u00a7 Stevens API).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Contracts live in <code>shared/data.ts<\/code>, imported by server and UI (SPEC.md \u00a7 Architecture).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Model IDs are checked against <code>GET /v1/models<\/code> at startup (SPEC.md \u00a7 Meta API wiring).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Voice is not on the Responses API: <code>fetch<\/code> plus <code>FormData<\/code>, with the signature designed after the day-1 spike (SPEC.md \u00a7 Architecture).<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>No user path: the server is infrastructure. Its visible surface is every screen, which loads through these routes.<\/p>", "scope": "Stevens API, media route, SSE", "roles": "all", "overall": "planned"}, {"file": "policy.md", "title": "Policy", "last_verified": "uncommitted on 2026-10-26 (source)", "intro": "<p>Policy is data: a table of rules in <code>server/boundary/rules.ts<\/code>, each with an <code>id<\/code>, mapping (vault, classification, owner?, viewer role, purpose) to <code>visible | privy | excluded<\/code>. <code>policy()<\/code> is a lookup into that table; no <code>if (role === \u2026)<\/code> access logic exists anywhere else. The inspector shows the rule ID behind every included or withheld source. Day 4 build. Overall maturity: everything planned.<\/p>", "subs": [{"id": "policy-table", "what": "Rules table maps vault, classification, owner, viewer role, and purpose to an access level with a rule ID", "what_text": "Rules table maps vault, classification, owner, viewer role, and purpose to an access level with a rule ID", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Server components, SPEC.md \u00a7 Contracts", "driving": "<ul><li><b>policy-table<\/b>: assemble the same call for both roles \u2192 <code>stevensctl api --as Associate answer --field &#x27;.manifest.withheld&#x27;<\/code> then <code>--as Partner<\/code> \u2192 partner memo withheld for the Associate, included for the Partner; wall withheld for both.<\/li><\/ul>", "notes": ""}, {"id": "policy-defaults", "what": "Personal is visible to its owner and excluded for others; team is visible for all; partner-only is Partner-visible and Associate-privy; wall is excluded for all", "what_text": "Personal is visible to its owner and excluded for others; team is visible for all; partner-only is Partner-visible and Associate-privy; wall is excluded for all", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Contracts", "driving": "<ul><li><b>policy-defaults<\/b>: assemble a personal quote for owner and non-owner \u2192 <code>stevensctl api --as Associate brief --field &#x27;.manifest.included&#x27;<\/code> then <code>--as Partner<\/code> \u2192 owner includes the quote, non-owner withholds it without a release.<\/li><\/ul>", "notes": ""}, {"id": "policy-exhaustive", "what": "An exhaustive test checks every role \u00d7 source \u00d7 purpose: the prompt includes a source if and only if the table allows it, and each manifest entry names the rule", "what_text": "An exhaustive test checks every role \u00d7 source \u00d7 purpose: the prompt includes a source if and only if the table allows it, and each manifest entry names the rule", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Validation", "driving": "<ul><li><b>policy-exhaustive<\/b>: run the suite \u2192 <code>stevensctl test<\/code> \u2192 the exhaustive policy test passes with every manifest entry naming its rule ID.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>Every rule change updates the exhaustive policy test (AGENTS.md \u00a7 Hard rules).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>The inspector shows the rule ID behind every included or withheld source (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Privy text never reaches a viewer: text from a <code>privy<\/code> or <code>excluded<\/code> source never goes into a prompt whose output that viewer sees (SPEC.md \u00a7 The access rule).<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>No user path: policy is infrastructure. Its visible surface is the inspector and the rule IDs on each manifest entry.<\/p>", "scope": "Rules table + exhaustive test", "roles": "all", "overall": "planned"}, {"file": "assembler.md", "title": "Assembler", "last_verified": "uncommitted on 2026-10-26 (source)", "intro": "<p>The context assembler in <code>server/boundary/assemble.ts<\/code> is the only path into a model call. Given a purpose and viewer it builds the prompt from what policy allows and emits a <code>Manifest<\/code> of included and withheld sources with rule IDs, the web-search flag, and raw vs assembled token counts. Privy calls include privy sources with a <code>Verdict<\/code> output schema; writer calls never include privy text. Day 4 build. Overall maturity: everything planned.<\/p>", "subs": [{"id": "assembler-manifest", "what": "Every model call is built by the assembler and emits a manifest with included and withheld sources, rule IDs, and the web-search flag", "what_text": "Every model call is built by the assembler and emits a manifest with included and withheld sources, rule IDs, and the web-search flag", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Server components, SPEC.md \u00a7 Contracts", "driving": "<ul><li><b>assembler-manifest<\/b>: assemble an Associate answer call \u2192 <code>stevensctl api --as Associate answer --expect 200 --field &#x27;.manifest.included&#x27;<\/code> \u2192 prompt built from allowed claims with a manifest.<\/li><\/ul>", "notes": ""}, {"id": "assembler-writers", "what": "Writer calls (brief, answer) include visible sources, the viewer's own personal claims, and the verdict \u2014 never privy text", "what_text": "Writer calls (brief, answer) include visible sources, the viewer's own personal claims, and the verdict \u2014 never privy text", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Server components", "driving": "<ul><li><b>assembler-writers<\/b>: string-search the logged writer prompts \u2192 <code>stevensctl api --as Associate brief --field &#x27;.manifest&#x27;<\/code> \u2192 no privy or excluded source text in any Associate writer prompt.<\/li><\/ul>", "notes": ""}, {"id": "assembler-budget", "what": "Each manifest records raw source tokens and assembled prompt tokens for the inspector", "what_text": "Each manifest records raw source tokens and assembled prompt tokens for the inspector", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Server components", "driving": "<ul><li><b>assembler-budget<\/b>: read an answer manifest \u2192 <code>stevensctl api --as Associate answer --field &#x27;.manifest.tokens&#x27;<\/code> \u2192 raw and assembled token counts.<\/li><\/ul>", "notes": ""}, {"id": "assembler-websearch", "what": "Web search is off for every call whose manifest includes enterprise data", "what_text": "Web search is off for every call whose manifest includes enterprise data", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Server components", "driving": "<ul><li><b>assembler-websearch<\/b>: check an enterprise call manifest \u2192 <code>stevensctl api --as Associate brief --field &#x27;.manifest.webSearch&#x27;<\/code> \u2192 <code>false<\/code>.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>A weak model is never asked to keep a secret; the boundary holds even if the model is weak (SPEC.md \u00a7 The access rule).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Privy calls include the privy sources and their output schema is <code>Verdict<\/code> (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>No Associate writer prompt (<code>brief<\/code>, <code>answer<\/code>) contains text from any privy or excluded source; the leak test string-searches the logged request bodies (SPEC.md \u00a7 Validation).<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>No user path: the assembler is infrastructure. Its visible surface is the inspector and the manifests behind each draft.<\/p>", "scope": "Context assembler, manifests, token budget", "roles": "all", "overall": "planned"}, {"file": "bridge.md", "title": "Bridge", "last_verified": "uncommitted on 2026-10-26 (source)", "intro": "<p>The bridge is the judged link from off-the-clock learning to a work decision: code proposes candidate claim pairs sharing an entity or metric, and the reasoning model labels each <code>contradicts | supports | context<\/code> with a reason, or rejects it. The demo bridge is mid-market churn 6\u20138% (talk) against the deck's net churn 1.8%. Day 5 build. Overall maturity: everything planned.<\/p>", "subs": [{"id": "bridge-candidates", "what": "Code proposes candidate pairs sharing an entity or metric across the two vaults", "what_text": "Code proposes candidate pairs sharing an entity or metric across the two vaults", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Server components", "driving": "<ul><li><b>bridge-candidates<\/b>: seed then list candidates \u2192 <code>stevensctl seed &amp;&amp; stevensctl api --as Associate bridge candidates --expect 200 --field &#x27;.pairs&#x27;<\/code> \u2192 the churn pair is proposed.<\/li><\/ul>", "notes": ""}, {"id": "bridge-judge", "what": "Wonder at high effort labels each pair with a relation and reason, or rejects it; text claims only", "what_text": "Wonder at high effort labels each pair with a relation and reason, or rejects it; text claims only", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Models, SPEC.md \u00a7 Server components", "driving": "<ul><li><b>bridge-judge<\/b>: judge the candidates \u2192 <code>stevensctl api --as Associate bridge judge --expect 200 --field &#x27;.bridges[0].relation&#x27;<\/code> \u2192 <code>contradicts<\/code> with a reason.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>Wonder is unverified until the day 1 A/B against Spark <code>high<\/code> on the bridge and privy prompts; the fallback is Spark 1.3 <code>high<\/code> (SPEC.md \u00a7 Models).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Wonder gets text only: image and audio input is reported inconsistently (SPEC.md \u00a7 Models).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Code prefilters candidates so the judge makes few calls; prompt iteration happens on Spark (SPEC.md \u00a7 Models).<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>Planned UI; no build exists yet. Intended path:<\/p><ol><li>Open the app at <code>http://localhost:5173<\/code>.<\/li><li>Choose \"Brief\".<\/li><li>See the churn bridge with one Personal Fact and one Enterprise Fact cited.<\/li><\/ol>", "scope": "Personal claims bearing on work claims", "roles": "all", "overall": "planned"}, {"file": "drafts.md", "title": "Drafts", "last_verified": "uncommitted on 2026-10-26 (source)", "intro": "<p>Drafts are what Stevens writes: the unprompted brief for the next Helios meeting and the Q&amp;A answer to \"Should we take the second meeting?\", both built from visible sources, the viewer's own personal claims, and the privy verdict \u2014 never privy text. The brief carries the churn bridge; the Associate answer recommends hold until Partner review. Day 5 build on top of the bridge. Overall maturity: everything planned.<\/p>", "subs": [{"id": "drafts-brief", "what": "Unprompted brief carries the churn bridge with 2 Fact citations and the \"ask how they define churn\" inference; the personal quote is chipped visible to you only", "what_text": "Unprompted brief carries the churn bridge with 2 Fact citations and the \"ask how they define churn\" inference; the personal quote is chipped visible to you only", "maturity": "planned", "surface": "UI+API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Demo, SPEC.md \u00a7 Validation", "driving": "<ul><li><b>drafts-brief<\/b>: drive the brief flow \u2192 <code>stevensctl browser run brief<\/code> \u2192 brief shows the churn bridge with one Personal Fact and one Enterprise Fact.<\/li><\/ul>", "notes": ""}, {"id": "drafts-answer", "what": "Asked answer uses visible data plus the privy verdict and recommends hold with an escalation when the conflicts memo applies", "what_text": "Asked answer uses visible data plus the privy verdict and recommends hold with an escalation when the conflicts memo applies", "maturity": "planned", "surface": "UI+API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Demo", "driving": "<ul><li><b>drafts-answer<\/b>: ask as Associate \u2192 <code>stevensctl api --as Associate answer --expect 200 --field &#x27;.sentences&#x27;<\/code> \u2192 cited answer recommending hold plus the escalation.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>Brief and answer writing run on Wonder at high effort only if Wonder wins the day 1 A/B; otherwise Spark <code>high<\/code> (SPEC.md \u00a7 Models).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Writer calls see visible sources, the viewer's own personal claims, and the <code>Verdict<\/code>; never privy text (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Every displayed sentence needs \u22651 citation; an injected unsupported sentence is dropped and counted (SPEC.md \u00a7 Validation).<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>Planned UI; no build exists yet. Intended path:<\/p><ol><li>Open the app at <code>http://localhost:5173<\/code>.<\/li><li>Choose \"Brief\" to read the unprompted brief with the visible-to-you-only chip.<\/li><li>Choose \"Ask\", type \"Should we take the second meeting?\", and read the answer.<\/li><\/ol>", "scope": "Unprompted brief + Q&A answer", "roles": "Associate, Partner", "overall": "planned"}, {"file": "privy.md", "title": "Privy", "last_verified": "uncommitted on 2026-10-26 (source)", "intro": "<p>The privy step is the agent\u2194viewer boundary at answer time: Wonder reasons over the privy sources that code matched by entity and returns only a <code>Verdict<\/code> with no string fields. An Associate's answer recommends \"hold until Partner review\" without ever learning why, and an escalation is drafted to a Partner. Failures fail closed. Day 5 build. Overall maturity: everything planned.<\/p>", "subs": [{"id": "privy-verdict", "what": "The privy step sees code-matched privy sources and returns exactly a verdict (proceed, hold, or decline plus routing); one call per question", "what_text": "The privy step sees code-matched privy sources and returns exactly a verdict (proceed, hold, or decline plus routing); one call per question", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Models, SPEC.md \u00a7 Contracts", "driving": "<ul><li><b>privy-verdict<\/b>: ask with the conflicts memo present \u2192 <code>stevensctl api --as Associate answer --expect 200 --field &#x27;.verdict&#x27;<\/code> \u2192 <code>hold<\/code> routed to Partner with no memo text in the response.<\/li><\/ul>", "notes": ""}, {"id": "privy-escalation", "what": "A hold verdict produces an escalation draft to a Partner carrying no content; with the conflicts memo removed there is no escalation", "what_text": "A hold verdict produces an escalation draft to a Partner carrying no content; with the conflicts memo removed there is no escalation", "maturity": "planned", "surface": "UI+API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Contracts, SPEC.md \u00a7 Validation", "driving": "<ul><li><b>privy-escalation<\/b>: ask with and without the memo \u2192 <code>stevensctl api --as Associate answer --field &#x27;.escalation&#x27;<\/code> \u2192 escalation event with no content; rerun with the memo removed \u2192 <code>proceed<\/code> and no escalation.<\/li><\/ul>", "notes": ""}, {"id": "privy-fail-closed", "what": "A privy step that fails validation twice yields hold routed to a Partner, flagged as failed closed", "what_text": "A privy step that fails validation twice yields hold routed to a Partner, flagged as failed closed", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Server components, SPEC.md \u00a7 Validation", "driving": "<ul><li><b>privy-fail-closed<\/b>: force the privy step to fail \u2192 <code>stevensctl meta fake --mode garbage &amp;&amp; stevensctl api --as Associate answer --field &#x27;.verdict&#x27;<\/code> \u2192 <code>hold<\/code> with <code>failedClosed: true<\/code> and a <code>Simulated \u2014 privy check failed<\/code> label; then <code>stevensctl meta fake --mode normal<\/code>.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li><code>Verdict<\/code> has no string fields by design; extra fields or strings are rejected (SPEC.md \u00a7 Contracts, SPEC.md \u00a7 Validation).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li><code>escalation.drafted<\/code> carries no content by design, and shows personal sources as owner-only (SPEC.md \u00a7 Contracts, SPEC.md \u00a7 Demo).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Privy reveals that something matters and which way it pushes; that leak is accepted for partner memos, and legal walls are <code>excluded<\/code> instead (SPEC.md \u00a7 The access rule).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>The privy step never falls back to showing content when it cannot complete (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>Planned UI; no build exists yet. Intended path:<\/p><ol><li>Open the app at <code>http://localhost:5173<\/code>.<\/li><li>As Associate, choose \"Ask\" and type \"Should we take the second meeting?\".<\/li><li>See \"Recommendation: hold until a Partner reviews. Stevens weighed information you are not privy to.\" plus the drafted escalation.<\/li><\/ol>", "scope": "Privy verdict channel + escalation, fail closed", "roles": "Associate, Partner", "overall": "planned"}, {"file": "release.md", "title": "Release", "last_verified": "uncommitted on 2026-10-26 (source)", "intro": "<p>The release gate in <code>server/boundary/release.ts<\/code> is the personal\u2192firm boundary: escalations, approved decisions, and every response to a non-owner pass through it. Personal citations render as \"Personal source (owner only)\" unless a <code>personal.released<\/code> event exists for that claim. Only the owner can release a quote, one quote per release, and each release is logged. Day 4 build with the gate enforced from day 5 on. Overall maturity: everything planned.<\/p>", "subs": [{"id": "release-share", "what": "The owner clicks Share with the firm on one quote, which logs a personal.released event for that claim", "what_text": "The owner clicks Share with the firm on one quote, which logs a personal.released event for that claim", "maturity": "planned", "surface": "UI+API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Demo, SPEC.md \u00a7 Contracts", "driving": "<ul><li><b>release-share<\/b>: release the churn quote \u2192 <code>stevensctl api --as Associate release &lt;claimId&gt; --expect tle": "", "html": "<ul><li>If any response cannot pass the release gate, it is withheld rather than shown (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>Planned UI; no build exists yet. Intended path:<\/p><ol><li>Open the app at <code>http://localhost:5173<\/code> as Associate.<\/li><li>In the brief, click \"Share with the firm\" on the churn quote.<\/li><li>Switch to Partner and see the released quote while every other personal source shows as owner-only.<\/li><\/ol>", "scope": "Personal \u2192 firm release gate", "roles": "Associate, Partner", "overall": "planned"}, {"file": "inspector.md", "title": "Inspector", "last_verified": "uncommitted on 2026-10-26 (source)", "intro": "<p>The boundary inspector makes the enforced boundary inspectable: for each model call it shows what went in, what was withheld and which policy rule applied, and raw vs assembled token counts. The answer call contains no partner memo; an Associate sees \"1 privy check ran \u2014 contents hidden\"; web search was off for every enterprise call. Day 6 UI. Overall maturity: everything planned.<\/p>", "subs": [{"id": "inspector-manifests", "what": "Each model call shows included sources, withheld sources with rule IDs, the web-search flag, raw vs assembled tokens, and dropped-sentence counts", "what_text": "Each model call shows included sources, withheld sources with rule IDs, the web-search flag, raw vs assembled tokens, and dropped-sentence counts", "maturity": "planned", "surface": "UI", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Demo, SPEC.md \u00a7 Contracts", "driving": "<ul><li><b>inspector-manifests<\/b>: drive the inspector flow \u2192 <code>stevensctl browser run inspector<\/code> \u2192 answer call lists included sources, withheld memo and wall item with rule IDs, and web search off.<\/li><\/ul>", "notes": ""}, {"id": "inspector-hidden", "what": "Privy manifest contents stay hidden from a viewer who   const p = st.panel || {};
  $("panel").innerHTML = p.sub ? panelSub(byId[p.sub]) : p.area ? panelArea(D.areas.find(a => a.file === p.area))
    : p.j ? panelJourney(D.journeys.find(j => j.id === p.j)) : panelHome();
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-id],[data-area],[data-j],[data-tab],[data-area-m],#clearj");
  if (!t) return;
  if (t.id === "clearj") { st.journey = null; }
  else if (t.dataset.tab) st.tab = t.dataset.tab;
  else if (t.dataset.id) { st.sel = t.dataset.id; st.panel = {sub: t.dataset.id}; }
  else if (t.dataset.area) st.panel = {area: t.dataset.area};
  else if (t.dataset.areaM) { const [f, m] = t.dataset.areaM.split("|"); st.mat = new Set([m]); st.tab = "map"; st.panel = {area: f}; }
  else if (t.dataset.j) { st.journey = st.journey === t.dataset.j && st.tab === "journeys" ? null : t.dataset.j; st.panel = {j: t.dataset.j};
    if (t.closest("#panel")) st.tab = "map"; }
  render();
});
$("q").oninput = ev => { st.q = ev.target.value.trim().toLowerCase(); render(); };
header(); render();
</script></body></html>
