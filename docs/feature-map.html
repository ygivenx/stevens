<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stevens feature map</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e3e0;
--planned:#e0e0e6;--deferred:#b8b8bd;--stub:#d9534f;--api-only:#e8a33d;--beta:#4a7fd4;--pending:#36a3a3;--stable:#3a9d5d;
--pass:#3a9d5d;--fail:#d9534f;--partial:#e8a33d;--skip:#9a9aa0}
@media (prefers-color-scheme:dark){:root{--bg:#151517;--card:#1f1f22;--ink:#ececee;--mute:#9a9aa2;--line:#2f2f34}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:18px 24px 8px}h1{margin:0 0 4px;font-size:20px}.sub{color:var(--mute);font-size:13px}
.sub p,.sub ul{margin:2px 0}.sub ul{padding-left:18px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 6px;background:var(--line)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:2px 10px;cursor:pointer;user-select:none;font-size:12px;color:var(--ink)}
.chip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.chip.off{opacity:.35}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:4px 24px 10px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.controls input{padding:6px 10px;border:1px solid var(--line);border-radius:6px;width:260px;background:var(--card);color:var(--ink)}
.group{display:flex;gap:5px;align-items:center}.group b{font-size:12px;color:var(--mute);font-weight:600;margin-right:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;padding:14px 24px 40px}
@media (max-width:1100px){main{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tab{padding:5px 12px;border-radius:6px;cursor:pointer;border:1px solid var(--line);background:var(--card)}
.tab.on{background:var(--ink);color:var(--bg)}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.area{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.area h2{margin:0;font-size:15px;cursor:pointer}.area h2:hover{text-decoration:underline}
.area .meta{color:var(--mute);font-size:12px;margin:2px 0 6px}
.area .bar{height:8px;margin:6px 0 8px}
.tiles{display:flex;flex-wrap:wrap;gap:4px}
.tile{width:22px;height:22px;border-radius:4px;cursor:pointer;position:relative;border:2px solid transparent}
.tile.notdriven{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.45) 0 3px,transparent 3px 6px)}
.tile.failed::after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--fail);border:1.5px solid var(--card)}
.tile.dim{opacity:.12}.tile.hit{border-color:var(--ink)}.tile.sel{outline:3px solid var(--ink);outline-offset:1px}
.tile:hover{transform:scale(1.15)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.panel h3{margin:0 0 4px;font-size:16px}.panel h4{margin:14px 0 4px;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;color:#fff;font-size:12px;font-weight:600}
.kv{display:grid;grid-template-columns:90px 1fr;gap:3px 10px;font-size:13px;margin-top:8px}.kv div:nth-child(odd){color:var(--mute)}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(127,127,127,.13);padding:0 3px;border-radius:3px;word-break:break-word}
pre{font:12px ui-monospace,Menlo,monospace;background:rgba(127,127,127,.1);padding:8px;border-radius:6px;overflow:auto;white-space:pre}
.gotcha{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:8px 0;font-size:13px}.gotcha p,.gotcha ul{margin:2px 0}
.gotcha.hit{border-left-color:var(--fail)}.gotcha.near{border-left-color:var(--api-only)}
ul,ol{padding-left:20px;margin:4px 0}
.journeys{display:flex;flex-direction:column;gap:8px}
.journey{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center}
.journey.on{outline:2px solid var(--ink)}.journey .n{color:var(--mute);font-size:12px}
.matrix{border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;width:100%}
.matrix th,.matrix td{border:1px solid var(--line);padding:6px 8px;text-align:center;font-size:13px}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix td.c{cursor:pointer;font-weight:600}
.trow{display:flex;gap:8px;font-size:12px;border-bottom:1px solid var(--line);padding:2px 0}.trow span{flex:1}
.empty{color:var(--mute)}
a.link{color:inherit;cursor:pointer;text-decoration:underline dotted}
</style></head><body>

<script>
const D = {"areas": [{"file": "capture.md", "title": "Capture", "last_verified": "uncommitted on 2026-10-27 (live)", "intro": "<p>Capture stages what Stevens reasons over: Ray-Ban Meta glasses captures (a staged ~90s conference talk, a slide photo, article highlights) into the personal vault, and the fictional Helios deal data (deck photo, CRM record, memos) into the enterprise vault. Fixtures live in the server-only <code>fixtures/<\/code> directory and reach the browser only through the policy-checked media route. Day 1 proved both perception gates with live calls on placeholders (spike log: <code>spikes/day1/README.md<\/code>). Day 2 committed placeholder fixtures plus text sources to <code>fixtures/<\/code> and drove ingest live: all 10 sources land in the ledger through <code>POST /api/ingest<\/code>. The real glasses shoot stays pending. Overall maturity: everything beta (happy path works in Chromium; real glasses files still pending).<\/p>", "subs": [{"id": "capture-talk-audio", "what": "Staged ~90s two-voice talk transcribes via Voice batch with speaker labels and timestamps into the personal vault", "what_text": "Staged ~90s two-voice talk transcribes via Voice batch with speaker labels and timestamps into the personal vault", "maturity": "beta", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/capture.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-capture.png<\/code>", "driving": "<ul><li><b>capture-talk-audio<\/b>: ingest then read state \u2192 <code>stevensctl api --as Associate ingest --expect 200<\/code> then <code>api --as Associate state --field &#x27;.events&#x27;<\/code> \u2192 <code>talk-oct20<\/code> carries the transcript and <code>data/derived/talk-oct20.json<\/code> its turns.<\/li><\/ul>", "notes": ""}, {"id": "capture-slide-photo", "what": "Glasses slide photo reads to verbatim text via Spark vision at low effort, stored for Fact checks", "what_text": "Glasses slide photo reads to verbatim text via Spark vision at low effort, stored for Fact checks", "maturity": "beta", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/capture.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-capture.png<\/code>", "driving": "<ul><li><b>capture-slide-photo<\/b>: same run \u2192 state shows <code>slide-oct20<\/code> with verbatim slide text stored for Fact checks.<\/li><\/ul>", "notes": ""}, {"id": "capture-articles", "what": "3 article highlights land in the personal vault as text claims", "what_text": "3 article highlights land in the personal vault as text claims", "maturity": "beta", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/capture.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-capture.png<\/code>", "driving": "<ul><li><b>capture-articles<\/b>: same run \u2192 state shows the 3 article highlights as ingested text sources.<\/li><\/ul>", "notes": ""}, {"id": "capture-enterprise", "what": "Helios deal + CRM record, deck photo, team memo, partner-only conflicts memo, and one wall item seed the enterprise vault", "what_text": "Helios deal + CRM record, deck photo, team memo, partner-only conflicts memo, and one wall item seed the enterprise vault", "maturity": "beta", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/capture.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-capture.png<\/code>", "driving": "<ul><li><b>capture-enterprise<\/b>: same run \u2192 state shows the deal, CRM, deck, memos, and the wall item (filtering lands day 4).<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>The Voice endpoint, upload format, and timestamp/speaker response shape are unknown until the day 1 spike, and the client signature is designed after it (SPEC.md \u00a7 Meta API wiring).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Glasses-mic audio of a distant speaker may transcribe poorly; the fallback is phone audio near the speaker with glasses video (SPEC.md \u00a7 Non-goals and risks).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Captures are pre-recorded files, not streamed; live glasses streaming via the Device Access Toolkit is out of scope (SPEC.md \u00a7 Fixtures).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Committed media are TTS/PIL placeholders, not glasses captures; the shoot stays with the user, and the real-mic test rides with it.<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Ingest drives ran on fake <code>normal<\/code>; the live path is the same code and its endpoints were proven by the day-1 spikes.<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>SAM 3.1 screen-cropping is built only if day 1 shows Spark misreads the uncropped photo (SPEC.md \u00a7 Models).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li><code>Source.fixture<\/code> is a path under the server-only <code>fixtures/<\/code> directory, never <code>public/<\/code> and never a blob URL; media reaches the browser only through <code>GET /api/media/:sourceId<\/code> (SPEC.md \u00a7 Contracts).<\/li><\/ul>", "ids": [], "near": []}], "how": "<ol><li>Open the app at <code>http://localhost:5173<\/code>.<\/li><li>Choose \"Capture\".<\/li><li>See the talk transcript with speaker labels and timestamps, the slide photo with read text, and both vault lists.<\/li><\/ol>", "scope": "Glasses captures and fixtures into the two vaults", "roles": "all", "overall": "beta"}, {"file": "extraction.md", "title": "Extraction", "last_verified": "uncommitted on 2026-10-27 (live)", "intro": "<p>Extraction turns captured text (transcripts, photo text, documents) into structured claims via Spark at low effort with JSON output, and the runtime citation resolver guards everything Stevens displays: every sentence needs a citation, Fact quotes must be verbatim, and failing sentences are dropped and counted. Day 3 built and drove it live: 23 claims extracted, every quote resolving. Overall maturity: everything api-only.<\/p>", "subs": [{"id": "extraction-claims", "what": "Transcript and photo text become structured claims (entity, metric, value, verbatim quote, timestamp, speaker)", "what_text": "Transcript and photo text become structured claims (entity, metric, value, verbatim quote, timestamp, speaker)", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/pipeline/extract.ts<\/code>, <code>/tmp/stevens-verify/day3/evidence/extract-live.json<\/code>", "driving": "<ul><li><b>extraction-claims<\/b>: ingest then extract \u2192 <code>stevensctl api --as Associate ingest --expect 200<\/code> then <code>api --as Associate extract --expect 200<\/code> \u2192 23 claims; every quote resolves against its source text.<\/li><\/ul>", "notes": ""}, {"id": "extraction-resolver", "what": "Every displayed sentence resolves \u22651 citation; Fact quotes are verbatim substrings; unsupported sentences are dropped and counted", "what_text": "Every displayed sentence resolves \u22651 citation; Fact quotes are verbatim substrings; unsupported sentences are dropped and counted", "maturity": "api-only", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/resolver/resolve.ts<\/code>, <code>/tmp/stevens-verify/day5/evidence/brief2.json<\/code>", "driving": "<ul><li><b>extraction-resolver<\/b>: write then read the brief \u2192 <code>api --as Associate brief<\/code> \u2192 kept sentences resolve, failures counted in <code>droppedSentences<\/code>.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li><code>Claim.quote<\/code> must be a verbatim substring of its source's <code>text<\/code>; <code>at<\/code> and <code>speaker<\/code> come from Voice timestamps and speaker labels (SPEC.md \u00a7 Contracts).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>A Fact's quote must resolve against the claim and the claim's quote against the source text; the resolver drops failures from the draft but counts them for the inspector (\"1 unsupported sentence removed\") (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Stevens says \"nothing relevant\" rather than inventing when no claim resolves (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>The cheaper <code>muse-spark-1.3-contributor<\/code> tier won the day-1 A/B and runs extraction (SPEC.md \u00a7 Models).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Every structured response is validated against a zod schema, retried once, then fails closed (SPEC.md \u00a7 Architecture).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Strict schemas must list every property in <code>required<\/code>; optional fields are nullable (the API rejects partial lists).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>The server loads <code>.env.local<\/code> at boot; the key never leaves the server process.<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>Planned UI; no build exists yet. Intended path:<\/p><ol><li>Open the app at <code>http://localhost:5173<\/code>.<\/li><li>Choose a source in \"Capture\".<\/li><li>See its extracted claims with quotes linked back to the source text.<\/li><\/ol>", "scope": "Transcript/photo text to structured claims + citation resolver", "roles": "all", "overall": "api-only"}, {"file": "ledger.md", "title": "Ledger", "last_verified": "uncommitted on 2026-10-27 (live)", "intro": "<p>The ledger is the append-only event log at <code>data/ledger.jsonl<\/code> (gitignored) recording the whole pipeline (<code>source.ingested<\/code> through <code>draft.approved<\/code>), with every real model call logging its model, response ID, usage, and stage key inside its event. Every stage call has a stage key and is reused if it already completed; events are appended before the UI hears of them; a crash resumes with no repeated paid call; replay never re-calls the API. Day 2 built it and drove it live: append/read with stage keys, kill-and-resume with no repeated completed call, failed-attempt logging, and state re-read with a static call counter. Overall maturity: replay beta, events and resume api-only.<\/p>", "subs": [{"id": "ledger-events", "what": "Every pipeline step appends a typed event; real calls log model, response ID, usage, and stage key in theirs; failed attempts log usage too", "what_text": "Every pipeline step appends a typed event; real calls log model, response ID, usage, and stage key in theirs; failed attempts log usage too", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/ledger/store.ts<\/code>, <code>server/ledger/store.test.ts<\/code>, <code>/tmp/stevens-verify/day2/evidence/ingest1.json<\/code>", "driving": "<ul><li><b>ledger-events<\/b>: ingest then read state \u2192 <code>stevensctl api --as Associate ingest --expect 200<\/code> then <code>stevensctl api --as Associate state --field &#x27;.events&#x27;<\/code> \u2192 10 typed <code>source.ingested<\/code> events with model, response ID, usage, and stage key on paid calls.<\/li><\/ul>", "notes": ""}, {"id": "ledger-resume", "what": "A crash or API error resumes from the last completed stage, so no completed paid call repeats", "what_text": "A crash or API error resumes from the last completed stage, so no completed paid call repeats", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/pipeline/ingest.ts<\/code>, <code>/tmp/stevens-verify/day2/evidence/ingest-resumed.json<\/code>", "driving": "<ul><li>  "", "html": "<ul><li><code>kill -9<\/code> is not a logged attempt: an in-flight call at kill time retries after restart, so the counter counts it twice while the ledger completes it once.<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>No user path: the ledger is infrastructure. Its visible surface is the inspector and the replay behavior on refresh.<\/p>", "scope": "Durable pipeline ledger + replay", "roles": "all", "overall": "beta"}, {"file": "server.md", "title": "Server", "last_verified": "uncommitted on 2026-10-27 (live)", "intro": "<p>The server owns the boundary: a Hono app on :8787 holds the vaults, policy, assembler, pipeline, ledger, and every Meta call, and the browser receives only viewer-filtered JSON. <code>MODEL_API_KEY<\/code> exists only in <code>.env.local<\/code> and the server process. The Vite UI on :5173 proxies <code>/api<\/code> to the server and adds no key; <code>npm start<\/code> serves the built UI from the server. Day 4 filtered state per viewer and added the release and media routes. Overall maturity: everything api-only.<\/p>", "subs": [{"id": "server-state", "what": "GET /api/state returns the viewer-filtered ledger projection for the X-Viewer-Role caller", "what_text": "GET /api/state returns the viewer-filtered ledger projection for the X-Viewer-Role caller", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/boundary/filter.ts<\/code>, <code>/tmp/stevens-verify/day4/evidence/assoc2.json<\/code>", "driving": "<ul><li><b>server-state<\/b>: read state as each role \u2192 <code>stevensctl api --as Associate state --expect 200 --field &#x27;.events&#x27;<\/code> then <code>--as Partner<\/code> \u2192 both read the ledger projection (per-role filtering lands with the day-4 policy).<\/li><\/ul>", "notes": ""}, {"id": "server-actions", "what": "POST ingest, ask, release, approve, and reject run the pipeline and gates for the calling viewer", "what_text": "POST ingest, ask, release, approve, and reject run the pipeline and gates for the calling viewer", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/index.ts<\/code>", "driving": "<ul><li><b>server-actions<\/b>: run the pipeline \u2192 <code>api ingest<\/code>, <code>extract<\/code>, <code>bridge<\/code>, <code>brief<\/code>, <code>ask --data<\/code>, <code>release/&lt;id&gt;<\/code>, <code>approve/&lt;id&gt;<\/code> \u2192 every action answers with ledgered results.<\/li><\/ul>", "notes": ""}, {"id": "server-media", "what": "GET /api/media/:sourceId serves fixture media only after a policy check; fixtures are never served statically", "what_text": "GET /api/media/:sourceId serves fixture media only after a policy check; fixtures are never served statically", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/index.ts<\/code>", "driving": "<ul><li><b>server-media<\/b>: fetch media as each role \u2192 <code>stevensctl api --as Associate media &lt;sourceId&gt; --expect 200<\/code> \u2192 bytes for allowed sources, rejection for withheld ones; no fixture URL works outside this route.<\/li><\/ul>", "notes": ""}, {"id": "server-events", "what": "GET /api/events streams pipeline progress over server-sent events", "what_text": "GET /api/events streams pipeline progress over server-sent events", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/index.ts<\/code>, <code>/tmp/stevens-verify/day2/evidence/sse-clean.out<\/code>", "driving": "<ul><li><b>server-events<\/b>: watch a run \u2192 <code>curl -s http://localhost:8787/api/events<\/code> during <code>api ingest<\/code> \u2192 ledger replay plus live appends and heartbeats (the api driver has no events surface yet).<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>The browser calls only Stevens' own <code>/api/*<\/code>, never Meta (SPEC.md \u00a7 Stevens API).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Contracts live in <code>shared/data.ts<\/code>, imported by server and UI (SPEC.md \u00a7 Architecture).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Model IDs are checked against <code>GET /v1/models<\/code> at startup (SPEC.md \u00a7 Meta API wiring).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Voice is not on the Responses API: <code>fetch<\/code> plus <code>FormData<\/code> to <code>POST /v1/asr/transcribe<\/code> with DIARIZATION mode (SPEC.md \u00a7 Meta API wiring).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li><code>server-state<\/code> drops non-visible sources entirely: text, title, and id never reach that viewer (SPEC.md \u00a7 Contracts).<\/li><\/ul>", "ids": ["server-state"], "near": []}, {"title": "", "html": "<ul><li><code>seed<\/code> truncates the ledger, so an SSE stream open across a reseed sees inconsistent offsets; reseed with no watchers.<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>No user path: the server is infrastructure. Its visible surface is every screen, which loads through these routes.<\/p>", "scope": "Stevens API, media route, SSE", "roles": "all", "overall": "api-only"}, {"file": "policy.md", "title": "Policy", "last_verified": "uncommitted on 2026-10-27 (source)", "intro": "<p>Policy is data: a table of rules in <code>server/boundary/rules.ts<\/code>, each with an <code>id<\/code>, mapping (vault, classification, owner?, viewer role, purpose) to <code>visible | privy | excluded<\/code>. <code>policy()<\/code> is a lookup into that table; no <code>if (role === \u2026)<\/code> access logic exists anywhere else. The inspector shows the rule ID behind every included or withheld source. Day 4 built it with the exhaustive test. Overall maturity: everything api-only.<\/p>", "subs": [{"id": "policy-table", "what": "Rules table maps vault, classification, owner, viewer role, and purpose to an access level with a rule ID", "what_text": "Rules table maps vault, classification, owner, viewer role, and purpose to an access level with a rule ID", "maturity": "api-only", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "<code>server/boundary/rules.ts<\/code>, <code>server/boundary/policy.test.ts<\/code>", "driving": "<ul><li><b>policy-table<\/b>: run the suite \u2192 <code>stevensctl test<\/code> \u2192 exhaustive test names the matching rule ID for every role \u00d7 source \u00d7 purpose.<\/li><\/ul>", "notes": ""}, {"id": "policy-defaults", "what": "Personal is visible to its owner and excluded for others; team is visible for all; partner-only is Partner-visible and Associate-privy; wall is excluded for all", "what_text": "Personal is visible to its owner and excluded for others; team is visible for all; partner-only is Partner-visible and Associate-privy; wall is excluded for all", "maturity": "api-only", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "<code>server/boundary/policy.ts<\/code>, <code>server/boundary/policy.test.ts<\/code>", "driving": "<ul><li><b>policy-defaults<\/b>: run the suite \u2192 <code>stevensctl test<\/code> \u2192 defaults asserted against the SPEC table, plus a Partner-owned personal source.<\/li><\/ul>", "notes": ""}, {"id": "policy-exhaustive", "what": "An exhaustive test checks every role \u00d7 source \u00d7 purpose: the prompt includes a source if and only if the table allows it, and each manifest entry names the rule", "what_text": "An exhaustive test checks every role \u00d7 source \u00d7 purpose: the prompt includes a source if and only if the table allows it, and each manifest entry names the rule", "maturity": "api-only", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "<code>server/boundary/policy.test.ts<\/code>", "driving": "<ul><li><b>policy-exhaustive<\/b>: run the suite \u2192 <code>stevensctl test<\/code> \u2192 every manifest entry names its rule ID.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>Every rule change updates the exhaustive policy test (AGENTS.md \u00a7 Hard rules).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>The inspector shows the rule ID behind every included or withheld source (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Privy text never reaches a viewer: text from a <code>privy<\/code> or <code>excluded<\/code> source never goes into a prompt whose output that viewer sees (SPEC.md \u00a7 The access rule).<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>No user path: policy is infrastructure. Its visible surface is the inspector and the rule IDs on each manifest entry.<\/p>", "scope": "Rules table + exhaustive test", "roles": "all", "overall": "api-only"}, {"file": "assembler.md", "title": "Assembler", "last_verified": "uncommitted on 2026-10-27 (source)", "intro": "<p>The context assembler in <code>server/boundary/assemble.ts<\/code> is the only path into a model call. Given a purpose and viewer it builds the prompt from what policy allows and emits a <code>Manifest<\/code> of included and withheld sources with rule IDs, the web-search flag, and raw vs assembled token counts. Privy calls include privy sources with a <code>Verdict<\/code> output schema; writer calls never include privy text. Day 4 build. Overall maturity: everything api-only.<\/p>", "subs": [{"id": "assembler-manifest", "what": "Every model call is built by the assembler and emits a manifest with included and withheld sources, rule IDs, and the web-search flag", "what_text": "Every model call is built by the assembler and emits a manifest with included and withheld sources, rule IDs, and the web-search flag", "maturity": "api-only", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "<code>server/boundary/assemble.ts<\/code>, <code>server/boundary/assemble.test.ts<\/code>", "driving": "<ul><li><b>assembler-manifest<\/b>: run the suite \u2192 <code>stevensctl test<\/code> \u2192 assembler tests prove manifests with rule IDs on every entry.<\/li><\/ul>", "notes": ""}, {"id": "assembler-writers", "what": "Writer calls (brief, answer) include visible sources, the viewer's own personal claims, and the verdict \u2014 never privy text", "what_text": "Writer calls (brief, answer) include visible sources, the viewer's own personal claims, and the verdict \u2014 never privy text", "maturity": "api-only", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "<code>server/boundary/assemble.ts<\/code>, <code>server/boundary/assemble.test.ts<\/code>", "driving": "<ul><li><b>assembler-writers<\/b>: run the suite \u2192 <code>stevensctl test<\/code> \u2192 leak tests string-search Associate writer prompts (live writer prompts arrive day 5).<\/li><\/ul>", "notes": ""}, {"id": "assembler-budget", "what": "Each manifest records raw source tokens and assembled prompt tokens for the inspector", "what_text": "Each manifest records raw source tokens and assembled prompt tokens for the inspector", "maturity": "api-only", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "<code>server/boundary/assemble.ts<\/code>, <code>server/boundary/assemble.test.ts<\/code>", "driving": "<ul><li><b>assembler-budget<\/b>: run the suite \u2192 <code>stevensctl test<\/code> \u2192 token estimates asserted on every manifest.<\/li><\/ul>", "notes": ""}, {"id": "assembler-websearch", "what": "Web search is off for every call whose manifest includes enterprise data", "what_text": "Web search is off for every call whose manifest includes enterprise data", "maturity": "api-only", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "<code>server/boundary/assemble.ts<\/code>, <code>server/boundary/assemble.test.ts<\/code>", "driving": "<ul><li><b>assembler-websearch<\/b>: run the suite \u2192 <code>stevensctl test<\/code> \u2192 <code>webSearch<\/code> false on every manifest.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>A weak model is never asked to keep a secret; the boundary holds even if the model is weak (SPEC.md \u00a7 The access rule).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Privy calls include the privy sources and their output schema is <code>Verdict<\/code> (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>No Associate writer prompt (<code>brief<\/code>, <code>answer<\/code>) contains text from any privy or excluded source; the leak test string-searches the logged request bodies (SPEC.md \u00a7 Validation).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Token counts are chars/4 estimates, consistent across raw and assembled.<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>No user path: the assembler is infrastructure. Its visible surface is the inspector and the manifests behind each draft.<\/p>", "scope": "Context assembler, manifests, token budget", "roles": "all", "overall": "api-only"}, {"file": "bridge.md", "title": "Bridge", "last_verified": "uncommitted on 2026-10-27 (live)", "intro": "<p>The bridge is the judged link from off-the-clock learning to a work decision: code proposes candidate claim pairs sharing an entity or metric, and the reasoning model labels each <code>contradicts | supports | context<\/code> with a reason, or rejects it. The demo bridge is mid-market churn 6\u20138% (talk) against the deck's net churn 1.8%. Day 5 built and drove it live: 4 pairs judged, talk\u00d7deal among them. Overall maturity: everything api-only.<\/p>", "subs": [{"id": "bridge-candidates", "what": "Code proposes candidate pairs sharing an entity or metric across the two vaults", "what_text": "Code proposes candidate pairs sharing an entity or metric across the two vaults", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/pipeline/bridge.ts<\/code>, <code>/tmp/stevens-verify/day5/evidence/bridge2.json<\/code>", "driving": "<ul><li><b>bridge-candidates<\/b>: judge the pairs \u2192 <code>stevensctl api --as Associate bridge --expect 200 --field &#x27;.judged&#x27;<\/code> \u2192 churn-family pairs proposed (metric head-noun match, one pair per source pair).<\/li><\/ul>", "notes": ""}, {"id": "bridge-judge", "what": "Wonder at high effort labels each pair with a relation and reason, or rejects it; text claims only", "what_text": "Wonder at high effort labels each pair with a relation and reason, or rejects it; text claims only", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/pipeline/bridge.ts<\/code>, <code>/tmp/stevens-verify/day5/evidence/bridge2.json<\/code>", "driving": "<ul><li><b>bridge-judge<\/b>: judge the candidates \u2192 <code>stevensctl api --as Associate bridge --expect 200 --field &#x27;.judged&#x27;<\/code> \u2192 judged pairs with a relation and reason (live judges said <code>context<\/code>).<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>Wonder won the day-1 A/B and judges; the fallback stays Spark 1.3 <code>high<\/code> (SPEC.md \u00a7 Models).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Wonder gets text only: image and audio input is reported inconsistently (SPEC.md \u00a7 Models).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Code prefilters candidates so the judge makes few calls; prompt iteration happens on Spark (SPEC.md \u00a7 Models).<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>Planned UI; no build exists yet. Intended path:<\/p><ol><li>Open the app at <code>http://localhost:5173<\/code>.<\/li><li>Choose \"Brief\".<\/li><li>See the churn bridge with one Personal Fact and one Enterprise Fact cited.<\/li><\/ol>", "scope": "Personal claims bearing on work claims", "roles": "all", "overall": "api-only"}, {"file": "drafts.md", "title": "Drafts", "last_verified": "uncommitted on 2026-10-27 (live)", "intro": "<p>Drafts are what Stevens writes: the unprompted brief for the next Helios meeting and the Q&amp;A answer to \"Should we take the second meeting?\", both built from visible sources, the viewer's own personal claims, and the privy verdict \u2014 never privy text. The brief carries the churn bridge; the Associate answer recommends hold until Partner review. Day 5 built and drove it live: 7-sentence brief, hold answer with escalation. Overall maturity: everything beta (happy path works in Chromium).<\/p>", "subs": [{"id": "drafts-brief", "what": "Unprompted brief carries the churn bridge with 2 Fact citations and the \"ask how they define churn\" inference; the personal quote is chipped visible to you only", "what_text": "Unprompted brief carries the churn bridge with 2 Fact citations and the \"ask how they define churn\" inference; the personal quote is chipped visible to you only", "maturity": "beta", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/brief.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-brief.png<\/code>", "driving": "<ul><li><b>drafts-brief<\/b>: write the brief \u2192 <code>stevensctl api --as Associate brief --expect 200<\/code> \u2192 cross-vault bridge sentences with 0 dropped (chip renders day 6).<\/li><\/ul>", "notes": ""}, {"id": "drafts-answer", "what": "Asked answer uses visible data plus the privy verdict and recommends hold with an escalation when the conflicts memo applies", "what_text": "Asked answer uses visible data plus the privy verdict and recommends hold with an escalation when the conflicts memo applies", "maturity": "beta", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/answer.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-answer.png<\/code>", "driving": "<ul><li><b>drafts-answer<\/b>: ask as Associate \u2192 <code>stevensctl api --as Associate ask --data &#x27;{&quot;question&quot;:&quot;...&quot;}&#x27; --expect 200<\/code> \u2192 cited answer recommending hold plus the escalation.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>Brief and answer writing run on Wonder at high effort after its day-1 A/B win (SPEC.md \u00a7 Models).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Writer calls see visible sources, the viewer's own personal claims, and the <code>Verdict<\/code>; never privy text (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Every displayed sentence needs \u22651 citation; an injected unsupported sentence is dropped and counted (SPEC.md \u00a7 Validation).<\/li><\/ul>", "ids": [], "near": []}], "how": "<ol><li>Open the app at <code>http://localhost:5173<\/code>.<\/li><li>Choose \"Brief\" to read the unprompted brief with the visible-to-you-only chip.<\/li><li>Choose \"Ask\", type \"Should we take the second meeting?\", and read the answer.<\/li><\/ol>", "scope": "Unprompted brief + Q&A answer", "roles": "Associate, Partner", "overall": "beta"}, {"file": "privy.md", "title": "Privy", "last_verified": "uncommitted on 2026-10-27 (live)", "intro": "<p>The privy step is the agent\u2194viewer boundary at answer time: Wonder reasons over the privy sources that code matched by entity and returns only a <code>Verdict<\/code> with no string fields. An Associate's answer recommends \"hold until Partner review\" without ever learning why, and an escalation is drafted to a Partner. Failures fail closed. Day 5 built and drove it live. Overall maturity: escalation beta, verdict and fail-closed api-only.<\/p>", "subs": [{"id": "privy-verdict", "what": "The privy step sees code-matched privy sources and returns exactly a verdict (proceed, hold, or decline plus routing); one call per question", "what_text": "The privy step sees code-matched privy sources and returns exactly a verdict (proceed, hold, or decline plus routing); one call per question", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/pipeline/ask.ts<\/code>, <code>/tmp/stevens-verify/day5/evidence/answer2.json<\/code>", "driving": "<ul><li><b>privy-verdict<\/b>: ask with the conflicts memo present \u2192 <code>stevensctl api --as Associate ask --data &#x27;{&quot;question&quot;:&quot;Should we take the second Helios meeting?&quot;}&#x27; --field &#x27;.verdict&#x27;<\/code> \u2192 <code>hold<\/code> routed to Partner with no memo text in the response.<\/li><\/ul>", "notes": ""}, {"id": "privy-escalation", "what": "A hold verdict produces an escalation draft to a Partner carrying no content; with the conflicts memo removed there is no escalation", "what_text": "A hold verdict produces an escalation draft to a Partner carrying no content; with the conflicts memo removed there is no escalation", "maturity": "beta", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/answer.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-answer.png<\/code>", "driving": "<ul><li><b>privy-escalation<\/b>: ask with and without a match \u2192 the Helios ask escalates with no content; an unmatched ask yields <code>proceed<\/code> and no escalation (unit-covered in <code>pipeline.test.ts<\/code>).<\/li><\/ul>", "notes": ""}, {"id": "privy-fail-closed", "what": "A privy step that fails validation twice yields hold routed to a Partner, flagged as failed closed", "what_text": "A privy step that fails validation twice yields hold routed to a Partn     <p>${s.what}</p><div>${badge(s.maturity)}</div>
    <div class="kv"><div>Surface</div><div>${esc(s.surface)}</div><div>Since</div><div><code>${esc(s.since)}</code></div>
    <div>Live</div><div>${s.live}</div><div>Evidence</div><div>${s.evidence}</div></div>
    ${s.notes ? `<h4>Grade notes</h4>${s.notes}` : ""}
    <h4>How to prove it</h4>${s.driving || `<p class="empty">No "Driving it" bullet names this id.</p>`}
    <h4>Gotchas</h4>${g.map(x => `<div class="gotcha hit">${x.html}</div>`).join("")}
    ${gn.length ? `<div class="n">Cite the same source lines as this row's evidence:</div>` + gn.map(x => `<div class="gotcha near">${x.html}</div>`).join("") : ""}
    ${g.length + gn.length ? "" : `<p class="empty">None tied to this row.</p>`}
    <p><a class="link" data-area="${esc(s.file)}">All ${area.gotchas.length} ${esc(s.area)} gotchas</a></p>
    <h4>Journeys</h4>${js.length ? js.map(j => `<div><a class="link" data-j="${j.id}">${esc(j.name)}</a> ${badge(j.verdict)}</div>`).join("") : `<p class="empty">Not part of a journey.</p>`}`;
}
function panelArea(a) {
  return `<h3>${esc(a.title)}</h3><div class="n">${esc(a.file)} · last verified ${esc(a.last_verified)}</div>
    <div class="bar">${bar(a.subs)}</div>${a.intro}<h4>How to get to it</h4>${a.how}
    <h4>Gotchas (${a.gotchas.length})</h4>${a.gotchas.map(g => `<div class="gotcha">${g.html}</div>`).join("")}`;
}
function panelJourney(j) {
  return `<h3>${esc(j.name)}</h3><div>${badge(j.verdict)} <span class="n">${esc(j.id)} · ${esc(j.areas)} · last live ${esc(j.last)}</span></div><p>${j.result}</p>
    <h4>Touches (${j.ids.length})</h4><div>${j.ids.map(i => `<a class="link" data-id="${i}">${i}</a>`).join(", ")}</div>${j.html}`;
}
function panelHome() {
  const worst = subs.filter(s => s.maturity === "stub" || s.liveState === "failed");
  return `<h3>Start here</h3><p>Tiles are sub-features, colored by maturity. <b>Striped</b>: never driven live. <b>Red dot</b>: a live drive failed. Click an area title for its summary and gotchas, the Journeys tab for cross-area flows, Matrix for counts.</p>
    <h4>Stub or failed live (${worst.length})</h4>${worst.map(s => `<div><a class="link" data-id="${s.id}">${s.id}</a> ${badge(s.maturity)}</div>`).join("")}`;
}
function render() {
  chips($("fmat"), D.maturity, st.mat, m => MCOL[m]);
  chips($("flive"), LIVE, st.live);
  chips($("fsurf"), SURF, st.surf);
  $("tabs").innerHTML = [["map","Map"],["journeys","Journeys"],["matrix","Matrix"]].map(([k,l]) =>
    `<span class="tab ${st.tab === k ? "on" : ""}" data-tab="${k}">${l}</span>`).join("") +
    (st.journey ? `<span class="chip" id="clearj">✕ journey filter: ${esc(st.journey)}</span>` : "");
  $("view").innerHTML = st.tab === "map" ? viewMap() : st.tab === "journeys" ? viewJourneys() : viewMatrix();
  const p = st.panel || {};
  $("panel").innerHTML = p.sub ? panelSub(byId[p.sub]) : p.area ? panelArea(D.areas.find(a => a.file === p.area))
    : p.j ? panelJourney(D.journeys.find(j => j.id === p.j)) : panelHome();
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-id],[data-area],[data-j],[data-tab],[data-area-m],#clearj");
  if (!t) return;
  if (t.id === "clearj") { st.journey = null; }
  else if (t.dataset.tab) st.tab = t.dataset.tab;
  else if (t.dataset.id) { st.sel = t.dataset.id; st.panel = {sub: t.dataset.id}; }
  else if (t.dataset.area) st.panel = {area: t.dataset.area};
  else if (t.dataset.areaM) { const [f, m] = t.dataset.areaM.split("|"); st.mat = new Set([m]); st.tab = "map"; st.panel = {area: f}; }
  else if (t.dataset.j) { st.journey = st.journey === t.dataset.j && st.tab === "journeys" ? null : t.dataset.j; st.panel = {j: t.dataset.j};
    if (t.closest("#panel")) st.tab = "map"; }
  render();
});
$("q").oninput = ev => { st.q = ev.target.value.trim().toLowerCase(); render(); };
header(); render();
</script></body></html>
