<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stevens feature map</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e3e0;
--planned:#e0e0e6;--deferred:#b8b8bd;--stub:#d9534f;--api-only:#e8a33d;--beta:#4a7fd4;--pending:#36a3a3;--stable:#3a9d5d;
--pass:#3a9d5d;--fail:#d9534f;--partial:#e8a33d;--skip:#9a9aa0}
@media (prefers-color-scheme:dark){:root{--bg:#151517;--card:#1f1f22;--ink:#ececee;--mute:#9a9aa2;--line:#2f2f34}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:18px 24px 8px}h1{margin:0 0 4px;font-size:20px}.sub{color:var(--mute);font-size:13px}
.sub p,.sub ul{margin:2px 0}.sub ul{padding-left:18px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 6px;background:var(--line)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:2px 10px;cursor:pointer;user-select:none;font-size:12px;color:var(--ink)}
.chip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.chip.off{opacity:.35}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:4px 24px 10px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.controls input{padding:6px 10px;border:1px solid var(--line);border-radius:6px;width:260px;background:var(--card);color:var(--ink)}
.group{display:flex;gap:5px;align-items:center}.group b{font-size:12px;color:var(--mute);font-weight:600;margin-right:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;padding:14px 24px 40px}
@media (max-width:1100px){main{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tab{padding:5px 12px;border-radius:6px;cursor:pointer;border:1px solid var(--line);background:var(--card)}
.tab.on{background:var(--ink);color:var(--bg)}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.area{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.area h2{margin:0;font-size:15px;cursor:pointer}.area h2:hover{text-decoration:underline}
.area .meta{color:var(--mute);font-size:12px;margin:2px 0 6px}
.area .bar{height:8px;margin:6px 0 8px}
.tiles{display:flex;flex-wrap:wrap;gap:4px}
.tile{width:22px;height:22px;border-radius:4px;cursor:pointer;position:relative;border:2px solid transparent}
.tile.notdriven{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.45) 0 3px,transparent 3px 6px)}
.tile.failed::after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--fail);border:1.5px solid var(--card)}
.tile.dim{opacity:.12}.tile.hit{border-color:var(--ink)}.tile.sel{outline:3px solid var(--ink);outline-offset:1px}
.tile:hover{transform:scale(1.15)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.panel h3{margin:0 0 4px;font-size:16px}.panel h4{margin:14px 0 4px;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;color:#fff;font-size:12px;font-weight:600}
.kv{display:grid;grid-template-columns:90px 1fr;gap:3px 10px;font-size:13px;margin-top:8px}.kv div:nth-child(odd){color:var(--mute)}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(127,127,127,.13);padding:0 3px;border-radius:3px;word-break:break-word}
pre{font:12px ui-monospace,Menlo,monospace;background:rgba(127,127,127,.1);padding:8px;border-radius:6px;overflow:auto;white-space:pre}
.gotcha{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:8px 0;font-size:13px}.gotcha p,.gotcha ul{margin:2px 0}
.gotcha.hit{border-left-color:var(--fail)}.gotcha.near{border-left-color:var(--api-only)}
ul,ol{padding-left:20px;margin:4px 0}
.journeys{display:flex;flex-direction:column;gap:8px}
.journey{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center}
.journey.on{outline:2px solid var(--ink)}.journey .n{color:var(--mute);font-size:12px}
.matrix{border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;width:100%}
.matrix th,.matrix td{border:1px solid var(--line);padding:6px 8px;text-align:center;font-size:13px}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix td.c{cursor:pointer;font-weight:600}
.trow{display:flex;gap:8px;font-size:12px;border-bottom:1px solid var(--line);padding:2px 0}.trow span{flex:1}
.empty{color:var(--mute)}
a.link{color:inherit;cursor:pointer;text-decoration:underline dotted}
</style></head><body>

<script>
const D = {"areas": [{"file": "capture.md", "title": "Capture", "last_verified": "uncommitted on 2026-10-27 (live)", "intro": "<p>Capture stages what Stevens reasons over: Ray-Ban Meta glasses captures (a staged ~90s conference talk, a slide photo, article highlights) into the personal vault, and the fictional Helios deal data (deck photo, CRM record, memos) into the enterprise vault. Fixtures live in the server-only <code>fixtures/<\/code> directory and reach the browser only through the policy-checked media route. Day 1 proved both perception gates with live calls on placeholders (spike log: <code>spikes/day1/README.md<\/code>). Day 2 committed placeholder fixtures plus text sources to <code>fixtures/<\/code> and drove ingest live: all 10 sources land in the ledger through <code>POST /api/ingest<\/code>. The real glasses shoot stays pending. Overall maturity: everything beta (happy path works in Chromium; real glasses files still pending).<\/p>", "subs": [{"id": "capture-talk-audio", "what": "Staged ~90s two-voice talk transcribes via Voice batch with speaker labels and timestamps into the personal vault", "what_text": "Staged ~90s two-voice talk transcribes via Voice batch with speaker labels and timestamps into the personal vault", "maturity": "beta", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/capture.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-capture.png<\/code>", "driving": "<ul><li><b>capture-talk-audio<\/b>: ingest then read state \u2192 <code>stevensctl api --as Associate ingest --expect 200<\/code> then <code>api --as Associate state --field &#x27;.events&#x27;<\/code> \u2192 <code>talk-oct20<\/code> carries the transcript and <code>data/derived/talk-oct20.json<\/code> its turns.<\/li><\/ul>", "notes": ""}, {"id": "capture-slide-photo", "what": "Glasses slide photo reads to verbatim text via Spark vision at low effort, stored for Fact checks", "what_text": "Glasses slide photo reads to verbatim text via Spark vision at low effort, stored for Fact checks", "maturity": "beta", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/capture.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-capture.png<\/code>", "driving": "<ul><li><b>capture-slide-photo<\/b>: same run \u2192 state shows <code>slide-oct20<\/code> with verbatim slide text stored for Fact checks.<\/li><\/ul>", "notes": ""}, {"id": "capture-articles", "what": "3 article highlights land in the personal vault as text claims", "what_text": "3 article highlights land in the personal vault as text claims", "maturity": "beta", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/capture.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-capture.png<\/code>", "driving": "<ul><li><b>capture-articles<\/b>: same run \u2192 state shows the 3 article highlights as ingested text sources.<\/li><\/ul>", "notes": ""}, {"id": "capture-enterprise", "what": "Helios deal + CRM record, deck photo, team memo, partner-only conflicts memo, and one wall item seed the enterprise vault", "what_text": "Helios deal + CRM record, deck photo, team memo, partner-only conflicts memo, and one wall item seed the enterprise vault", "maturity": "beta", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/capture.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-capture.png<\/code>", "driving": "<ul><li><b>capture-enterprise<\/b>: same run \u2192 state shows the deal, CRM, deck, memos, and the wall item (filtering lands day 4).<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>The Voice endpoint, upload format, and timestamp/speaker response shape are unknown until the day 1 spike, and the client signature is designed after it (SPEC.md \u00a7 Meta API wiring).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Glasses-mic audio of a distant speaker may transcribe poorly; the fallback is phone audio near the speaker with glasses video (SPEC.md \u00a7 Non-goals and risks).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Captures are pre-recorded files, not streamed; live glasses streaming via the Device Access Toolkit is out of scope (SPEC.md \u00a7 Fixtures).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Committed media are TTS/PIL placeholders, not glasses captures; the shoot stays with the user, and the real-mic test rides with it.<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Ingest drives ran on fake <code>normal<\/code>; the live path is the same code and its endpoints were proven by the day-1 spikes.<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>SAM 3.1 screen-cropping is built only if day 1 shows Spark misreads the uncropped photo (SPEC.md \u00a7 Models).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li><code>Source.fixture<\/code> is a path under the server-only <code>fixtures/<\/code> directory, never <code>public/<\/code> and never a blob URL; media reaches the browser only through <code>GET /api/media/:sourceId<\/code> (SPEC.md \u00a7 Contracts).<\/li><\/ul>", "ids": [], "near": []}], "how": "<ol><li>Open the app at <code>http://localhost:5173<\/code>.<\/li><li>Choose \"Capture\".<\/li><li>See the talk transcript with speaker labels and timestamps, the slide photo with read text, and both vault lists.<\/li><\/ol>", "scope": "Glasses captures and fixtures into the two vaults", "roles": "all", "overall": "beta"}, {"file": "extraction.md", "title": "Extraction", "last_verified": "uncommitted on 2026-10-27 (live)", "intro": "<p>Extraction turns captured text (transcripts, photo text, documents) into structured claims via Spark at low effort with JSON output, and the runtime citation resolver guards everything Stevens displays: every sentence needs a citation, Fact quotes must be verbatim, and failing sentences are dropped and counted. Day 3 built and drove it live: 23 claims extracted, every quote resolving. Overall maturity: everything api-only.<\/p>", "subs": [{"id": "extraction-claims", "what": "Transcript and photo text become structured claims (entity, metric, value, verbatim quote, timestamp, speaker)", "what_text": "Transcript and photo text become structured claims (entity, metric, value, verbatim quote, timestamp, speaker)", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/pipeline/extract.ts<\/code>, <code>/tmp/stevens-verify/day3/evidence/extract-live.json<\/code>", "driving": "<ul><li><b>extraction-claims<\/b>: ingest then extract \u2192 <code>stevensctl api --as Associate ingest --expect 200<\/code> then <code>api --as Associate extract --expect 200<\/code> \u2192 23 claims; every quote resolves against its source text.<\/li><\/ul>", "notes": ""}, {"id": "extraction-resolver", "what": "Every displayed sentence resolves \u22651 citation; Fact quotes are verbatim substrings; unsupported sentences are dropped and counted", "what_text": "Every displayed sentence resolves \u22651 citation; Fact quotes are verbatim substrings; unsupported sentences are dropped and counted", "maturity": "api-only", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/resolver/resolve.ts<\/code>, <code>/tmp/stevens-verify/day5/evidence/brief2.json<\/code>", "driving": "<ul><li><b>extraction-resolver<\/b>: write then read the brief \u2192 <code>api --as Associate brief<\/code> \u2192 kept sentences resolve, failures counted in <code>droppedSentences<\/code>.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li><code>Claim.quote<\/code> must be a verbatim substring of its source's <code>text<\/code>; <code>at<\/code> and <code>speaker<\/code> come from Voice timestamps and speaker labels (SPEC.md \u00a7 Contracts).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>A Fact's quote must resolve against the claim and the claim's quote against the source text; the resolver drops failures from the draft but counts them for the inspector (\"1 unsupported sentence removed\") (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Stevens says \"nothing relevant\" rather than inventing when no claim resolves (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>The cheaper <code>muse-spark-1.3-contributor<\/code> tier won the day-1 A/B and runs extraction (SPEC.md \u00a7 Models).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Every structured response is validated against a zod schema, retried once, then fails closed (SPEC.md \u00a7 Architecture).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Strict schemas must list every property in <code>required<\/code>; optional fields are nullable (the API rejects partial lists).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>The server loads <code>.env.local<\/code> at boot; the key never leaves the server process.<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>Planned UI; no build exists yet. Intended path:<\/p><ol><li>Open the app at <code>http://localhost:5173<\/code>.<\/li><li>Choose a source in \"Capture\".<\/li><li>See its extracted claims with quotes linked back to the source text.<\/li><\/ol>", "scope": "Transcript/photo text to structured claims + citation resolver", "roles": "all", "overall": "api-only"}, {"file": "ledger.md", "title": "Ledger", "last_verified": "uncommitted on 2026-10-27 (live)", "intro": "<p>The ledger is the append-only event log at <code>data/ledger.jsonl<\/code> (gitignored) recording the whole pipeline (<code>source.ingested<\/code> through <code>draft.approved<\/code>), with every real model call logging its model, response ID, usage, and stage key inside its event. Every stage call has a stage key and is reused if it already completed; events are appended before the UI hears of them; a crash resumes with no repeated paid call; replay never re-calls the API. Day 2 built it and drove it live: append/read with stage keys, kill-and-resume with no repeated completed call, failed-attempt logging, and state re-read with a static call counter. Overall maturity: replay beta, events and resume api-only.<\/p>", "subs": [{"id": "ledger-events", "what": "Every pipeline step appends a typed event; real calls log model, response ID, usage, and stage key in theirs; failed attempts log usage too", "what_text": "Every pipeline step appends a typed event; real calls log model, response ID, usage, and stage key in theirs; failed attempts log usage too", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/ledger/store.ts<\/code>, <code>server/ledger/store.test.ts<\/code>, <code>/tmp/stevens-verify/day2/evidence/ingest1.json<\/code>", "driving": "<ul><li><b>ledger-events<\/b>: ingest then read state \u2192 <code>stevensctl api --as Associate ingest --expect 200<\/code> then <code>stevensctl api --as Associate state --field &#x27;.events&#x27;<\/code> \u2192 10 typed <code>source.ingested<\/code> events with model, response ID, usage, and stage key on paid calls.<\/li><\/ul>", "notes": ""}, {"id": "ledger-resume", "what": "A crash or API error resumes from the last completed stage, so no completed paid call repeats", "what_text": "A crash or API error resumes from the last completed stage, so no completed paid call repeats", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/pipeline/ingest.ts<\/code>, <code>/tmp/stevens-verify/day2/evidence/ingest-resumed.json<\/code>", "driving": "<ul><li><b>ledger-resume<\/b>: slow the fake, ingest in background, <code>kill -9<\/code> the stack pgid, <code>stack up<\/code>, re-ingest \u2192 <code>talk-oct20<\/code> reused, every source ingested exactly once, counter grows only for incomplete stages.<\/li><\/ul>", "notes": ""}, {"id": "ledger-replay", "what": "A refresh replays the same brief, answer, and inspector from the ledger with zero new API calls", "what_text": "A refresh replays the same brief, answer, and inspector from the ledger with zero new API calls", "maturity": "beta", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/App.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-brief.png<\/code>", "driving": "<ul><li><b>ledger-replay<\/b>: reload and count API calls \u2192 <code>stevensctl meta calls<\/code> before and after <code>api state<\/code> \u2192 counter unchanged, same brief and answer (inspector UI day 6).<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>Model IDs in logged events must appear in <code>GET /v1/models<\/code>, so the 1.3 \u2192 1.2 \u2192 1.1 fallback still validates (SPEC.md \u00a7 Meta API wiring).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>A stage key hashes stage, source IDs, prompt version, and model; the server reuses a completed event with that key before calling (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>On a missing key or API error the app uses the cached fixture response with a visible <code>Simulated \u2014 &lt;reason&gt;<\/code> badge, and the boundary never degrades (SPEC.md \u00a7 Meta API wiring).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Live drives ran on fake <code>normal<\/code>/<code>slow<\/code>, so logged usage is zeros; the live usage shape was proven by the day-1 spikes (<code>spikes/day1/README.md<\/code>).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li><code>kill -9<\/code> is not a logged attempt: an in-flight call at kill time retries after restart, so the counter counts it twice while the ledger completes it once.<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>No user path: the ledger is infrastructure. Its visible surface is the inspector and the replay behavior on refresh.<\/p>", "scope": "Durable pipeline ledger + replay", "roles": "all", "overall": "beta"}, {"file": "server.md", "title": "Server", "last_verified": "uncommitted on 2026-10-27 (source)", "intro": "<p>The server owns the boundary: day 9b runs two Hono processes from one shared factory (<code>server/common/app.ts<\/code>) \u2014 Stevens \u00b7 firm on :8787 and Stevens \u00b7 yours on :8788 \u2014 each with its own ledger and SQLite file. The personal web app on :5173 proxies to :8788; the firm web app on :5174 proxies to :8787. <code>MODEL_API_KEY<\/code> and <code>STEVENS_AGENT_TOKEN<\/code> exist only in <code>.env.local<\/code> and the server processes. <code>npm start<\/code> serves each built UI from its own server. Overall maturity: everything api-only.<\/p>", "subs": [{"id": "server-state", "what": "GET /api/state returns the viewer-filtered ledger projection for the X-Viewer-Role caller", "what_text": "GET /api/state returns the viewer-filtered ledger projection for the X-Viewer-Role caller", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/boundary/filter.ts<\/code>, <code>/tmp/stevens-verify/day4/evidence/assoc2.json<\/code>", "driving": "<ul><li><b>server-state<\/b>: read state as each role \u2192 <code>stevensctl api --as Associate state --expect 200 --field &#x27;.events&#x27;<\/code> then <code>--as Partner<\/code> \u2192 both read the ledger projection (per-role filtering lands with the day-4 policy).<\/li><\/ul>", "notes": ""}, {"id": "server-actions", "what": "POST ingest, ask, release, approve, and reject run the pipeline and gates for the calling viewer", "what_text": "POST ingest, ask, release, approve, and reject run the pipeline and gates for the calling viewer", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/index.ts<\/code>", "driving": "<ul><li><b>server-actions<\/b>: run the pipeline \u2192 <code>api ingest<\/code>, <code>extract<\/code>, <code>bridge<\/code>, <code>brief<\/code>, <code>ask --data<\/code>, <code>release/&lt;id&gt;<\/code>, <code>approve/&lt;id&gt;<\/code> \u2192 every action answers with ledgered results.<\/li><\/ul>", "notes": ""}, {"id": "server-media", "what": "GET /api/media/:sourceId serves fixture media only after a policy check; fixtures are never served statically", "what_text": "GET /api/media/:sourceId serves fixture media only after a policy check; fixtures are never served statically", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/index.ts<\/code>", "driving": "<ul><li><b>server-media<\/b>: fetch media as each role \u2192 <code>stevensctl api --as Associate media &lt;sourceId&gt; --expect 200<\/code> \u2192 bytes for allowed sources, rejection for withheld ones; no fixture URL works outside this route.<\/li><\/ul>", "notes": ""}, {"id": "server-events", "what": "GET /api/events sends only empty <code>changed<\/code> signals over server-sent events, on both processes", "what_text": "GET /api/events sends only empty changed signals over server-sent events, on both processes", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/common/app.ts<\/code>, <code>server/firm/routes.test.ts<\/code>", "driving": "<ul><li><b>server-events<\/b>: watch a run \u2192 <code>curl -s http://localhost:8787/api/events<\/code> during <code>api ingest<\/code> \u2192 ledger replay plus live appends and heartbeats (the api driver has no events surface yet).<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>The browser calls only Stevens' own <code>/api/*<\/code>, never Meta (SPEC.md \u00a7 Stevens API).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Contracts live in <code>shared/data.ts<\/code>, imported by server and UI (SPEC.md \u00a7 Architecture).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Model IDs are checked against <code>GET /v1/models<\/code> at startup (SPEC.md \u00a7 Meta API wiring).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Voice is not on the Responses API: <code>fetch<\/code> plus <code>FormData<\/code> to <code>POST /v1/asr/transcribe<\/code> with DIARIZATION mode (SPEC.md \u00a7 Meta API wiring).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li><code>server-state<\/code> drops non-visible sources entirely: text, title, and id never reach that viewer (SPEC.md \u00a7 Contracts).<\/li><\/ul>", "ids": ["server-state"], "near": []}, {"title": "", "html": "<ul><li><code>seed<\/code> truncates the ledger, so an SSE stream open across a reseed sees inconsistent offsets; reseed with no watchers.<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Day 9a fix: <code>GET /api/events<\/code> sends only <code>event: changed<\/code> with <code>data: {}<\/code> and never ledger text (<code>server/index.ts<\/code>); covered by <code>server/routes.test.ts<\/code>. The client only uses the stream as a ping (<code>web/src/api.ts:55<\/code>).<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>No user path: the server is infrastructure. Its visible surface is every screen, which loads through these routes.<\/p>", "scope": "Stevens API, media route, SSE", "roles": "all", "overall": "api-only"}, {"file": "policy.md", "title": "Policy", "last_verified": "uncommitted on 2026-10-27 (source)", "intro": "<p>Policy is data: a table of rules in <code>server/boundary/rules.ts<\/code>, each with an <code>id<\/code>, mapping (vault, classification, owner?, viewer role, purpose) to <code>visible | privy | excluded<\/code>. <code>policy()<\/code> is a lookup into that table; no <code>if (role === \u2026)<\/code> access logic exists anywhere else. The inspector shows the rule ID behind every included or withheld source. Day 4 built it with the exhaustive test. Overall maturity: everything api-only.<\/p>", "subs": [{"id": "policy-table", "what": "Rules table maps vault, classification, owner, viewer role, and purpose to an access level with a rule ID", "what_text": "Rules table maps vault, classification, owner, viewer role, and purpose to an access level with a rule ID", "maturity": "api-only", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "<code>server/boundary/rules.ts<\/code>, <code>server/boundary/policy.test.ts<\/code>", "driving": "<ul><li><b>policy-table<\/b>: run the suite \u2192 <code>stevensctl test<\/code> \u2192 exhaustive test names the matching rule ID for every role \u00d7 source \u00d7 purpose.<\/li><\/ul>", "notes": ""}, {"id": "policy-defaults", "what": "Personal is visible to its owner and excluded for others; team is visible for all; partner-only is Partner-visible and Associate-privy; wall is excluded for all", "what_text": "Personal is visible to its owner and excluded for others; team is visible for all; partner-only is Partner-visible and Associate-privy; wall is excluded for all", "maturity": "api-only", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "<code>server/boundary/policy.ts<\/code>, <code>server/boundary/policy.test.ts<\/code>", "driving": "<ul><li><b>policy-defaults<\/b>: run the suite \u2192 <code>stevensctl test<\/code> \u2192 defaults asserted against the SPEC table, plus a Partner-owned personal source.<\/li><\/ul>", "notes": ""}, {"id": "policy-exhaustive", "what": "An exhaustive test checks every role \u00d7 source \u00d7 purpose: the prompt includes a source if and only if the table allows it, and each manifest entry names the rule", "what_text": "An exhaustive test checks every role \u00d7 source \u00d7 purpose: the prompt includes a source if and only if the table allows it, and each manifest entry names the rule", "maturity": "api-only", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "<code>server/boundary/policy.test.ts<\/code>", "driving": "<ul><li><b>policy-exhaustive<\/b>: run the suite \u2192 <code>stevensctl test<\/code> \u2192 every manifest entry names its rule ID.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>Every rule change updates the exhaustive policy test (AGENTS.md \u00a7 Hard rules).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>The inspector shows the rule ID behind every included or withheld source (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Privy text never reaches a viewer: text from a <code>privy<\/code> or <code>excluded<\/code> source never goes into a prompt whose output that viewer sees (SPEC.md \u00a7 The access rule).<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>No user path: policy is infrastructure. Its visible surface is the inspector and the rule IDs on each manifest entry.<\/p>", "scope": "Rules table + exhaustive test", "roles": "all", "overall": "api-only"}, {"file": "assembler.md", "title": "Assembler", "last_verified": "uncommitted on 2026-10-27 (source)", "intro": "<p>The context assembler in <code>server/boundary/assemble.ts<\/code> is the only path into a model call. Given a purpose and viewer it builds the prompt from what policy allows and emits a <code>Manifest<\/code> of included and withheld sources with rule IDs, the web-search flag, and raw vs assembled token counts. Privy calls include privy sources with a <code>Verdict<\/code> output schema; writer calls never include privy text. Day 4 build. Overall maturity: everything api-only.<\/p>", "subs": [{"id": "assembler-manifest", "what": "Every model call is built by the assembler and emits a manifest with included and withheld sources, rule IDs, and the web-search flag", "what_text": "Every model call is built by the assembler and emits a manifest with included and withheld sources, rule IDs, and the web-search flag", "maturity": "api-only", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "<code>server/boundary/assemble.ts<\/code>, <code>server/boundary/assemble.test.ts<\/code>", "driving": "<ul><li><b>assembler-manifest<\/b>: run the suite \u2192 <code>stevensctl test<\/code> \u2192 assembler tests prove manifests with rule IDs on every entry.<\/li><\/ul>", "notes": ""}, {"id": "assembler-writers", "what": "Writer calls (brief, answer) include visible sources, the viewer's own personal claims, and the verdict \u2014 never privy text", "what_text": "Writer calls (brief, answer) include visible sources, the viewer's own personal claims, and the verdict \u2014 never privy text", "maturity": "api-only", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "<code>server/boundary/assemble.ts<\/code>, <code>server/boundary/assemble.test.ts<\/code>", "driving": "<ul><li><b>assembler-writers<\/b>: run the suite \u2192 <code>stevensctl test<\/code> \u2192 leak tests string-search Associate writer prompts (live writer prompts arrive day 5).<\/li><\/ul>", "notes": ""}, {"id": "assembler-budget", "what": "Each manifest records raw source tokens and assembled prompt tokens for the inspector", "what_text": "Each manifest records raw source tokens and assembled prompt tokens for the inspector", "maturity": "api-only", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "<code>server/boundary/assemble.ts<\/code>, <code>server/boundary/assemble.test.ts<\/code>", "driving": "<ul><li><b>assembler-budget<\/b>: run the suite \u2192 <code>stevensctl test<\/code> \u2192 token estimates asserted on every manifest.<\/li><\/ul>", "notes": ""}, {"id": "assembler-websearch", "what": "Web search is off for every call whose manifest includes enterprise data", "what_text": "Web search is off for every call whose manifest includes enterprise data", "maturity": "api-only", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "<code>server/boundary/assemble.ts<\/code>, <code>server/boundary/assemble.test.ts<\/code>", "driving": "<ul><li><b>assembler-websearch<\/b>: run the suite \u2192 <code>stevensctl test<\/code> \u2192 <code>webSearch<\/code> false on every manifest.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>A weak model is never asked to keep a secret; the boundary holds even if the model is weak (SPEC.md \u00a7 The access rule).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Privy calls include the privy sources and their output schema is <code>Verdict<\/code> (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>No Associate writer prompt (<code>brief<\/code>, <code>answer<\/code>) contains text from any privy or excluded source; the leak test string-searches the logged request bodies (SPEC.md \u00a7 Validation).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Token counts are chars/4 estimates, consistent across raw and assembled.<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>No user path: the assembler is infrastructure. Its visible surface is the inspector and the manifests behind each draft.<\/p>", "scope": "Context assembler, manifests, token budget", "roles": "all", "overall": "api-only"}, {"file": "bridge.md", "title": "Bridge", "last_verified": "uncommitted on 2026-10-27 (live)", "intro": "<p>The bridge is the judged link from off-the-clock learning to a work decision: code proposes candidate claim pairs sharing an entity or metric, and the reasoning model labels each <code>contradicts | supports | context<\/code> with a reason, or rejects it. The demo bridge is mid-market churn 6\u20138% (talk) against the deck's net churn 1.8%. Day 5 built and drove it live: 4 pairs judged, talk\u00d7deal among them. Overall maturity: beta, no UI yet (bridge block arrives day 13).<\/p>", "subs": [{"id": "bridge-candidates", "what": "Code proposes candidate pairs sharing an entity or metric across the two vaults", "what_text": "Code proposes candidate pairs sharing an entity or metric across the two vaults", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/pipeline/bridge.ts<\/code>, <code>/tmp/stevens-verify/day5/evidence/bridge2.json<\/code>", "driving": "<ul><li><b>bridge-candidates<\/b>: judge the pairs \u2192 <code>stevensctl api --as Associate bridge --expect 200 --field &#x27;.judged&#x27;<\/code> \u2192 churn-family pairs proposed (metric head-noun match, one pair per source pair).<\/li><\/ul>", "notes": ""}, {"id": "bridge-judge", "what": "Wonder at high effort labels each pair with a relation and reason, or rejects it; text claims only", "what_text": "Wonder at high effort labels each pair with a relation and reason, or rejects it; text claims only", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/pipeline/bridge.ts<\/code>, <code>/tmp/stevens-verify/day5/evidence/bridge2.json<\/code>", "driving": "<ul><li><b>bridge-judge<\/b>: judge the candidates \u2192 <code>stevensctl api --as Associate bridge --expect 200 --field &#x27;.judged&#x27;<\/code> \u2192 judged pairs with a relation and reason (live judges said <code>context<\/code>).<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>Wonder won the day-1 A/B and judges; the fallback stays Spark 1.3 <code>high<\/code> (SPEC.md \u00a7 Models).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Wonder gets text only: image and audio input is reported inconsistently (SPEC.md \u00a7 Models).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Code prefilters candidates so the judge makes few calls; prompt iteration happens on Spark (SPEC.md \u00a7 Models).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Day 9a fix: <code>filterState<\/code> keeps the bridge reason for the owning viewer and returns <code>bridge: null<\/code> with redacted candidate ids for anyone else (<code>server/boundary/filter.ts<\/code>); covered by <code>filter.test.ts<\/code> bridge-reason tests and <code>server/routes.test.ts<\/code>. In v3 bridges never leave Stevens \u00b7 yours.<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>Planned UI; no build exists yet. Intended path:<\/p><ol><li>Open the app at <code>http://localhost:5173<\/code>.<\/li><li>Choose \"Brief\".<\/li><li>See the churn bridge with one Personal Fact and one Enterprise Fact cited.<\/li><\/ol>", "scope": "Personal claims bearing on work claims", "roles": "all", "overall": "api-only"}, {"file": "drafts.md", "title": "Drafts", "last_verified": "uncommitted on 2026-10-27 (live)", "intro": "<p>Drafts are what Stevens writes: the unprompted brief for the next Helios meeting and the Q&amp;A answer to \"Should we take the second meeting?\", both built from visible sources, the viewer's own personal claims, and the privy verdict \u2014 never privy text. The brief carries the churn bridge; the Associate answer recommends hold until Partner review. Day 5 built and drove it live: 7-sentence brief, hold answer with escalation. Overall maturity: everything beta (happy path works in Chromium).<\/p>", "subs": [{"id": "drafts-brief", "what": "Unprompted brief carries the churn bridge with 2 Fact citations and the \"ask how they define churn\" inference; the personal quote is chipped visible to you only", "what_text": "Unprompted brief carries the churn bridge with 2 Fact citations and the \"ask how they define churn\" inference; the personal quote is chipped visible to you only", "maturity": "beta", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/brief.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-brief.png<\/code>", "driving": "<ul><li><b>drafts-brief<\/b>: write the brief \u2192 <code>stevensctl api --as Associate brief --expect 200<\/code> \u2192 cross-vault bridge sentences with 0 dropped (chip renders day 6).<\/li><\/ul>", "notes": ""}, {"id": "drafts-answer", "what": "Asked answer uses visible data plus the privy verdict and recommends hold with an escalation when the conflicts memo applies", "what_text": "Asked answer uses visible data plus the privy verdict and recommends hold with an escalation when the conflicts memo applies", "maturity": "beta", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/answer.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-answer.png<\/code>", "driving": "<ul><li><b>drafts-answer<\/b>: ask as Associate \u2192 <code>stevensctl api --as Associate ask --data &#x27;{&quot;question&quot;:&quot;...&quot;}&#x27; --expect 200<\/code> \u2192 cited answer recommending hold plus the escalation.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>Brief and answer writing run on Wonder at high effort after its day-1 A/B win (SPEC.md \u00a7 Models).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Writer calls see visible sources, the viewer's own personal claims, and the <code>Verdict<\/code>; never privy text (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Every displayed sentence needs \u22651 citation; an injected unsupported sentence is dropped and counted (SPEC.md \u00a7 Validation).<\/li><\/ul>", "ids": [], "near": []}], "how": "<ol><li>Open the app at <code>http://localhost:5173<\/code>.<\/li><li>Choose \"Brief\" to read the unprompted brief with the visible-to-you-only chip.<\/li><li>Choose \"Ask\", type \"Should we take the second meeting?\", and read the answer.<\/li><\/ol>", "scope": "Unprompted brief + Q&A answer", "roles": "Associate, Partner", "overall": "beta"}, {"file": "privy.md", "title": "Privy", "last_verified": "uncommitted on 2026-10-27 (live)", "intro": "<p>The privy step is the agent\u2194viewer boundary at answer time: Wonder reasons over the privy sources that code matched by entity and returns only a <code>Verdict<\/code> with no string fields. An Associate's answer recommends \"hold until Partner review\" without ever learning why, and an escalation is drafted to a Partner. Failures fail closed. Day 5 built and drove it live. Overall maturity: escalation beta, verdict and fail-closed api-only.<\/p>", "subs": [{"id": "privy-verdict", "what": "The privy step sees code-matched privy sources and returns exactly a verdict (proceed, hold, or decline plus routing); one call per question", "what_text": "The privy step sees code-matched privy sources and returns exactly a verdict (proceed, hold, or decline plus routing); one call per question", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/pipeline/ask.ts<\/code>, <code>/tmp/stevens-verify/day5/evidence/answer2.json<\/code>", "driving": "<ul><li><b>privy-verdict<\/b>: ask with the conflicts memo present \u2192 <code>stevensctl api --as Associate ask --data &#x27;{&quot;question&quot;:&quot;Should we take the second Helios meeting?&quot;}&#x27; --field &#x27;.verdict&#x27;<\/code> \u2192 <code>hold<\/code> routed to Partner with no memo text in the response.<\/li><\/ul>", "notes": ""}, {"id": "privy-escalation", "what": "A hold verdict produces an escalation draft to a Partner carrying no content; with the conflicts memo removed there is no escalation", "what_text": "A hold verdict produces an escalation draft to a Partner carrying no content; with the conflicts memo removed there is no escalation", "maturity": "beta", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/answer.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-answer.png<\/code>", "driving": "<ul><li><b>privy-escalation<\/b>: ask with and without a match \u2192 the Helios ask escalates with no content; an unmatched ask yields <code>proceed<\/code> and no escalation (unit-covered in <code>pipeline.test.ts<\/code>).<\/li><\/ul>", "notes": ""}, {"id": "privy-fail-closed", "what": "A privy step that fails validation twice yields hold routed to a Partner, flagged as failed closed", "what_text": "A privy step that fails validation twice yields hold routed to a Partner, flagged as failed closed", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/pipeline/ask.ts<\/code>", "driving": "<ul><li><b>privy-fail-closed<\/b>: force the privy step to fail \u2192 <code>stevensctl meta fake --mode garbage<\/code> then ask \u2192 <code>hold<\/code> with <code>failedClosed: true<\/code> (the <code>Simulated<\/code> label renders day 7); then <code>meta fake --mode normal<\/code>.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li><code>Verdict<\/code> has no string fields by design; extra fields or strings are rejected (SPEC.md \u00a7 Contracts, SPEC.md \u00a7 Validation).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li><code>escalation.drafted<\/code> carries no content by design, and shows personal sources as owner-only (SPEC.md \u00a7 Contracts, SPEC.md \u00a7 Demo).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Privy reveals that something matters and which way it pushes; that leak is accepted for partner memos, and legal walls are <code>excluded<\/code> instead (SPEC.md \u00a7 The access rule).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>The privy step never falls back to showing content when it cannot complete (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}], "how": "<ol><li>Open the app at <code>http://localhost:5173<\/code>.<\/li><li>As Associate, choose \"Ask\" and type \"Should we take the second meeting?\".<\/li><li>See \"Recommendation: hold until a Partner reviews. Stevens weighed information you are not privy to.\" plus the drafted escalation.<\/li><\/ol>", "scope": "Privy verdict channel + escalation, fail closed", "roles": "Associate, Partner", "overall": "beta"}, {"file": "release.md", "title": "Release", "last_verified": "uncommitted on 2026-10-27 (live)", "intro": "<p>The release gate in <code>server/boundary/release.ts<\/code> is the personal\u2192firm boundary: escalations, approved decisions, and every response to a non-owner pass through it. Personal citations render as \"Personal source (owner only)\" unless a <code>personal.released<\/code> event exists for that claim. Only the owner can release a quote, one quote per release, and each release is logged. Day 4 built it and drove it live: owner release, 403 for non-owners, released quote visible to the Partner. Overall maturity: share beta, gate and owner-only api-only.<\/p>", "subs": [{"id": "release-share", "what": "The owner clicks Share with the firm on one quote, which logs a personal.released event for that claim", "what_text": "The owner clicks Share with the firm on one quote, which logs a personal.released event for that claim", "maturity": "beta", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/sentences.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-release.png<\/code>", "driving": "<ul><li><b>release-share<\/b>: release the churn quote \u2192 <code>stevensctl api --as Associate release/&lt;claimId&gt; --expect 200 --field .released<\/code> \u2192 <code>true<\/code> with a <code>personal.released<\/code> ledger event.<\/li><\/ul>", "notes": ""}, {"id": "release-gate", "what": "Escalations, approved decisions, and non-owner responses pass the gate; unreleased personal text renders owner-only or the response is withheld", "what_text": "Escalations, approved decisions, and non-owner responses pass the gate; unreleased personal text renders owner-only or the response is withheld", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/boundary/release.ts<\/code>, <code>server/boundary/filter.ts<\/code>", "driving": "<ul><li><b>release-gate<\/b>: read Partner state before and after release \u2192 <code>stevensctl api --as Partner state --field .events<\/code> \u2192 quote absent before, present after; escalations and decisions inherit the same gate day 5.<\/li><\/ul>", "notes": ""}, {"id": "release-owner-only", "what": "A release attempt by anyone but the claim's owner is rejected", "what_text": "A release attempt by anyone but the claim's owner is rejected", "maturity": "api-only", "surface": "API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>server/boundary/release.test.ts<\/code>", "driving": "<ul><li><b>release-owner-only<\/b>: release as non-owner \u2192 <code>stevensctl api --as Partner release/&lt;claimId&gt; --expect 403<\/code> \u2192 rejected with no event.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>Seeing your own quote in your own brief is not a crossing; a crossing is storage in an enterprise record, inclusion in an escalation or approved decision, or display to anyone but the owner (SPEC.md \u00a7 The access rule).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Nothing in enterprise code paths writes to the personal vault (SPEC.md \u00a7 Validation).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>If any response cannot pass the release gate, it is withheld rather than shown (SPEC.md \u00a7 Server components).<\/li><\/ul>", "ids": [], "near": []}], "how": "<ol><li>Open the app at <code>http://localhost:5173<\/code> as Associate.<\/li><li>In the brief, click \"Share with the firm\" on the churn quote.<\/li><li>Switch to Partner and see the released quote while every other personal source shows as owner-only.<\/li><\/ol>", "scope": "Personal \u2192 firm release gate", "roles": "Associate, Partner", "overall": "beta"}, {"file": "inspector.md", "title": "Inspector", "last_verified": "uncommitted on 2026-10-27 (live)", "intro": "<p>The boundary inspector makes the enforced boundary inspectable: for each model call it shows what went in, what was withheld and which policy rule applied, and raw vs assembled token counts. The answer call contains no partner memo; an Associate sees \"1 privy check ran \u2014 contents hidden\"; web search was off for every enterprise call. Day 6 UI drove it live via headless Chromium. Overall maturity: everything beta (happy path works; no interaction coverage beyond the flows).<\/p>", "subs": [{"id": "inspector-manifests", "what": "Each model call shows included sources, withheld sources with rule IDs, the web-search flag, raw vs assembled tokens, and dropped-sentence counts", "what_text": "Each model call shows included sources, withheld sources with rule IDs, the web-search flag, raw vs assembled tokens, and dropped-sentence counts", "maturity": "beta", "surface": "UI", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/inspector.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-inspector.png<\/code>", "driving": "<ul><li><b>inspector-manifests<\/b>: drive the inspector flow \u2192 <code>stevensctl browser run inspector<\/code> \u2192 answer call lists included sources, withheld memo and wall item with rule IDs, and web search off.<\/li><\/ul>", "notes": ""}, {"id": "inspector-hidden", "what": "Privy manifest contents stay hidden from a viewer who may not see them (\"1 privy check ran \u2014 contents hidden\"); the partner memo is absent from the answer call", "what_text": "Privy manifest contents stay hidden from a viewer who may not see them (\"1 privy check ran \u2014 contents hidden\"); the partner memo is absent from the answer call", "maturity": "beta", "surface": "UI", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/inspector.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-inspector.png<\/code>", "driving": "<ul><li><b>inspector-hidden<\/b>: drive as Associate \u2192 <code>stevensctl browser run inspector<\/code> \u2192 privy row reads \"1 privy check ran \u2014 contents hidden\".<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>The inspector reads manifests and ledger events; it never re-calls the API.<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>A <code>privy<\/code> manifest's contents are shown only to a viewer for whom every included source is <code>visible<\/code> (SPEC.md \u00a7 Contracts).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Role gating is part of the feature: a control the API would reject for that role is a defect (features/README.md).<\/li><\/ul>", "ids": [], "near": []}], "how": "<ol><li>Open the app at <code>http://localhost:5173<\/code>.<\/li><li>Choose \"Inspector\".<\/li><li>Pick a call to see its manifest: included, withheld with rule IDs, web search off, raw vs assembled tokens, dropped sentences counted.<\/li><\/ol>", "scope": "Boundary inspector over every model call", "roles": "Associate, Partner", "overall": "beta"}, {"file": "approval.md", "title": "Approval", "last_verified": "uncommitted on 2026-10-27 (live)", "intro": "<p>Approval closes the demo loop: switching to Partner reveals the conflicts memo (Helios competes with portfolio company Lumen) plus the released churn quote while every other personal source stays owner-only, the Partner approves \"take the meeting after conflict review\", and the decision is logged. The role switcher sends <code>X-Viewer-Role<\/code> and the server enforces it; the switcher is labeled \"simulated sign-in\". Routes live day 5; role-switch UI day 6. Overall maturity: everything beta (happy path works in Chromium).<\/p>", "subs": [{"id": "approval-role-switch", "what": "Associate/Partner switch changes what is visible: the Partner sees the conflicts memo and released quote the Associate's firm view never shows", "what_text": "Associate/Partner switch changes what is visible: the Partner sees the conflicts memo and released quote the Associate's firm view never shows", "maturity": "beta", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/App.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-role-switch.png<\/code>", "driving": "<ul><li><b>approval-role-switch<\/b>: switch roles \u2192 <code>stevensctl api --as Associate switch --data &#x27;{&quot;role&quot;:&quot;Partner&quot;}&#x27;<\/code> logs <code>role.switched<\/code>; per-role state verified day 4 (switcher UI day 6).<\/li><\/ul>", "notes": ""}, {"id": "approval-decision", "what": "The Partner approves or rejects a draft and the decision is logged with the draft id and role", "what_text": "The Partner approves or rejects a draft and the decision is logged with the draft id and role", "maturity": "beta", "surface": "UI+API", "since": "-", "live": "2026-10-27", "live_text": "2026-10-27", "evidence": "<code>web/src/answer.tsx<\/code>, <code>/tmp/stevens-verify/day6/evidence/run-approve.png<\/code>", "driving": "<ul><li><b>approval-decision<\/b>: approve as Partner \u2192 <code>stevensctl api --as Partner approve/&lt;draftId&gt; --expect 200<\/code> \u2192 <code>approved<\/code> with a <code>draft.approved<\/code> ledger event.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>Role switch itself is a ledger event (<code>role.switched<\/code>), so the inspector can show who saw what when (SPEC.md \u00a7 Contracts).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Draft status moves <code>draft<\/code> \u2192 <code>approved<\/code> or <code>rejected<\/code> only through this path (SPEC.md \u00a7 Contracts).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Auth is out of scope; the switcher is labeled \"simulated sign-in\" (SPEC.md \u00a7 Architecture).<\/li><\/ul>", "ids": [], "near": []}], "how": "<ol><li>Open the app at <code>http://localhost:5173<\/code>.<\/li><li>Switch role to Partner and read the conflicts memo and the released quote.<\/li><li>Choose \"Approve\" on the answer and see the logged decision.<\/li><\/ol>", "scope": "Role switch + approve/reject with logging", "roles": "Associate, Partner", "overall": "beta"}, {"file": "chat.md", "title": "Chat", "last_verified": "uncommitted on 2026-10-26 (source)", "intro": "<p>Follow-up chat is the gated stretch: after the first answer, the viewer can ask follow-ups through a durable agent whose tool calls resolve through the same policy. It starts only if the day-1 tool-calling check passed and day 5's exit check passed by the end of Sat Oct 31, and only with the user's confirmation. Until the go/no-go it stays deferred. Overall maturity: deferred by decision.<\/p>", "subs": [{"id": "chat-followups", "what": "After the first answer the viewer asks follow-ups in one conversation per viewer and draft, never forked across roles", "what_text": "After the first answer the viewer asks follow-ups in one conversation per viewer and draft, never forked across roles", "maturity": "deferred", "surface": "UI+API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Stretch", "driving": "<ul><li><b>chat-followups<\/b>: answer then follow up \u2192 <code>stevensctl api --as Associate ask --until &#x27;.draft&#x27;<\/code> then <code>stevensctl api --as Associate chat &lt;draftId&gt; --expect 200 --field &#x27;.sentences&#x27;<\/code> \u2192 cited follow-up in the same conversation.<\/li><\/ul>", "notes": ""}, {"id": "chat-tools", "what": "The agent's search_claims and get_quote tools resolve through the same policy, so privy content is never a tool result", "what_text": "The agent's search_claims and get_quote tools resolve through the same policy, so privy content is never a tool result", "maturity": "deferred", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md \u00a7 Stretch", "driving": "<ul><li><b>chat-tools<\/b>: ask for a privy fact \u2192 <code>stevensctl api --as Associate chat &lt;draftId&gt; --field &#x27;.sentences&#x27;<\/code> \u2192 the tools return only what the viewer may see, never privy text.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>The library is <code>@earendil-works/pi-durable<\/code> pinned to exactly <code>1.4.0<\/code>, with <code>pi-ai<\/code>'s built-in Meta provider reading <code>META_API_KEY<\/code> from <code>MODEL_API_KEY<\/code> (SPEC.md \u00a7 Stretch).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>The first answer stays on the fixed pipeline, and the citation resolver applies to every chat sentence (SPEC.md \u00a7 Stretch).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>The stretch is first to cut if the build runs behind (SPEC.md \u00a7 Build order).<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>Planned UI; no build exists yet, and the stretch may never start. Intended path:<\/p><ol><li>Open the app at <code>http://localhost:5173<\/code>.<\/li><li>Read an answer, then choose \"Ask a follow-up\".<\/li><li>Ask within the same conversation; every sentence stays cited.<\/li><\/ol>", "scope": "Follow-up chat (gated stretch)", "roles": "Associate, Partner", "overall": "deferred"}, {"file": "split.md", "title": "Process split", "last_verified": "uncommitted on 2026-10-27 (source)", "intro": "<p>v3 splits Stevens into two processes so the personal edge is physical: Stevens \u00b7 yours (:8788) holds the personal database; Stevens \u00b7 firm (:8787) holds the firm's. Day 9b landed the structure: shared code under <code>server/common/<\/code>, two Hono entries, both SQLite schemas, agent-token auth with <code>/agent/me<\/code>, the pinned clock, and a four-process dev stack. The agent context/privy/escalation/release endpoints arrive days 11\u201312; both processes still run the v2.1 pipeline until the behavior migrates. Overall maturity: split structure beta, agent endpoints planned.<\/p>", "subs": [{"id": "split-import-boundary", "what": "No firm file imports personal code or reads personal data, and vice versa; common imports neither", "what_text": "No firm file imports personal code or reads personal data, and vice versa; common imports neither", "maturity": "beta", "surface": "infra", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "<code>server/import-boundary.test.ts<\/code>", "driving": "<ul><li><b>split-import-boundary<\/b>: <code>stevensctl test<\/code> \u2192 the import-boundary suite passes; the firm suite passes with <code>data/personal/<\/code> absent.<\/li><\/ul>", "notes": ""}, {"id": "split-agent-auth", "what": "X-Stevens-Agent token resolves to a person; unknown token gets 401", "what_text": "X-Stevens-Agent token resolves to a person; unknown token gets 401", "maturity": "beta", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "<code>server/firm/agent-auth.ts<\/code>, <code>server/firm/routes.test.ts<\/code>", "driving": "<ul><li><b>split-agent-auth<\/b>: <code>stevensctl api --via agent --as nobody GET /agent/me --expect 401<\/code>, then <code>--as p-alex<\/code> \u2192 200 with Alex.<\/li><\/ul>", "notes": ""}, {"id": "split-age const MCOL = {"planned":"var(--planned)","deferred":"var(--deferred)","stub":"var(--stub)","api-only":"var(--api-only)","beta":"var(--beta)","beta (stable pending live)":"var(--pending)","stable":"var(--stable)"};
const VCOL = {"PASS":"var(--pass)","FAIL":"var(--fail)","PARTIAL":"var(--partial)","SKIP":"var(--skip)","NOT DRIVEN":"var(--skip)"};
const LIVE = ["driven","failed","not driven"], SURF = ["UI","API","WS","infra"];
const subs = D.areas.flatMap(a => a.subs.map(s => Object.assign(s, {area: a.title, file: a.file,

  surf: /UI/.test(s.surface) ? "UI" : /^API/.test(s.surface) ? "API" : /WS/.test(s.surface) ? "WS" : "infra",
  hay: [s.id, s.what_text, s.surface, s.live_text, s.evidence, a.title, s.notes].join(" ").toLowerCase()})));

const badge = m => `<span class="badge" style="background:${MCOL[m]||VCOL[m]}">${esc(m)}</span>`;
const count = (list, key, val) => list.filter(x => x[key] === val).length;

function bar(list) {
  return D.maturity.map(m => { const n = count(list, "maturity", m);
    return n ? `<span title="${m}: ${n}" style="width:${100*n/list.length}%;background:${MCOL[m]}"></span>` : ""; }).join("");
}
function chips(el, values, set, color) {
  el.innerHTML = el.querySelector("b").outerHTML + values.map(v => {
    const n = v in MCOL ? count(subs, "maturity", v) : count(subs, el.id === "flive" ? "liveState" : "surf", v);
    return `<span class="chip ${set.has(v) ? "" : "off"}" data-v="${esc(v)}">${color ? `<i style="background:${color(v)}"></i>` : ""}${esc(v)} ${n}</span>`;
  }).join("");
  el.querySelectorAll(".chip").forEach(c => c.onclick = ev => {
    const v = c.dataset.v;
    if (ev.altKey || ev.metaKey) { set.clear(); set.add(v); } else if (set.has(v)) set.delete(v); else set.add(v);
    render();
  });
}
function header() {

}
function tiles(a) {

  return a.subs.map(s => {
    const cls = ["tile", s.liveState === "not driven" ? "notdriven" : "", s.liveState === "failed" ? "failed" : "",
      !ok(s) || (hit && !hit.has(s.id)) ? "dim" : "", hit && hit.has(s.id) ? "hit" : "", st.sel === s.id ? "sel" : ""].join(" ");
    return `<span class="${cls}" style="background-color:${MCOL[s.maturity]}" data-id="${s.id}" title="${esc(s.id)} · ${esc(s.maturity)} · ${esc(s.liveState)}\n${esc(s.what_text)}"></span>`;
  }).join("");
}
function viewMap() {
  return `<div class="areas">` + D.areas.map(a => {
    const shown = a.subs.filter(ok).length;
    return `<div class="area"><h2 data-area="${esc(a.file)}">${esc(a.title)}</h2>

      <div class="bar">${bar(a.subs)}</div><div class="tiles">${tiles(a)}</div></div>`;

}
function viewJourneys() {
  return `<div class="journeys">` + D.journeys.map(j => `<div class="journey ${st.journey === j.id ? "on" : ""}" data-j="${j.id}">

    <div class="n">${j.ids.length} touched</div></div>`).join("") + `</div>`;
}
function viewMatrix() {
  const head = `<tr><th>Area</th>${D.maturity.map(m => `<th>${badge(m)}</th>`).join("")}<th>driven live</th><th>gotchas</th></tr>`;
  const rows = D.areas.map(a => `<tr><td><a class="link" data-area="${esc(a.file)}">${esc(a.title)}</a></td>` +
    D.maturity.map(m => { const n = a.subs.filter(s => s.maturity === m && ok(s)).length;
      return `<td class="c" data-area-m="${esc(a.file)}|${esc(m)}" style="${n ? `background:color-mix(in srgb, ${MCOL[m]} ${Math.min(85, 18 + n*9)}%, transparent)` : ""}">${n || ""}</td>`; }).join("") +
    `<td>${a.subs.filter(s => s.liveState !== "not driven").length}/${a.subs.length}</td><td>${a.gotchas.length}</td></tr>`).join("");
  return `<table class="matrix">${head}${rows}</table>`;

  return `<h3>${esc(s.id)}</h3><div class="n">${esc(s.area)} · <a class="link" data-area="${esc(s.file)}">${esc(s.file)}</a></div>

    ${g.length + gn.length ? "" : `<p class="empty">None tied to this row.</p>`}
    <p><a class="link" data-area="${esc(s.file)}">All ${area.gotchas.length} ${esc(s.area)} gotchas</a></p>
    <h4>Journeys</h4>${js.length ? js.map(j => `<div><a class="link" data-j="${j.id}">${esc(j.name)}</a> ${badge(j.verdict)}</div>`).join("") : `<p class="empty">Not part of a journey.</p>`}`;
}
function panelArea(a) {
  return `<h3>${esc(a.title)}</h3><div class="n">${esc(a.file)} · last verified ${esc(a.last_verified)}</div>
    <div class="bar">${bar(a.subs)}</div>${a.intro}<h4>How to get to it</h4>${a.how}
    <h4>Gotchas (${a.gotchas.length})</h4>${a.gotchas.map(g => `<div class="gotcha">${g.html}</div>`).join("")}`;
}
function panelJourney(j) {
  return `<h3>${esc(j.name)}</h3><div>${badge(j.verdict)} <span class="n">${esc(j.id)} · ${esc(j.areas)} · last live ${esc(j.last)}</span></div><p>${j.result}</p>
    <h4>Touches (${j.ids.length})</h4><div>${j.ids.map(i => `<a class="link" data-id="${i}">${i}</a>`).join(", ")}</div>${j.html}`;
}
function panelHome() {
  const worst = subs.filter(s => s.maturity === "stub" || s.liveState === "failed");
  return `<h3>Start here</h3><p>Tiles are sub-features, colored by maturity. <b>Striped</b>: never driven live. <b>Red dot</b>: a live drive failed. Click an area title for its summary and gotchas, the Journeys tab for cross-area flows, Matrix for counts.</p>
    <h4>Stub or failed live (${worst.length})</h4>${worst.map(s => `<div><a class="link" data-id="${s.id}">${s.id}</a> ${badge(s.maturity)}</div>`).join("")}`;

function render() {
  chips($("fmat"), D.maturity, st.mat, m => MCOL[m]);
  chips($("flive"), LIVE, st.live);
  chips($("fsurf"), SURF, st.surf);
  $("tabs").innerHTML = [["map","Map"],["journeys","Journeys"],["matrix","Matrix"]].map(([k,l]) =>
    `<span class="tab ${st.tab === k ? "on" : ""}" data-tab="${k}">${l}</span>`).join("") +

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-id],[data-area],[data-j],[data-tab],[data-area-m],#clearj");

  if (t.id === "clearj") { st.journey = null; }
  else if (t.dataset.tab) st.tab = t.dataset.tab;

    if (t.closest("#panel")) st.tab = "map"; }
  render();
});
