<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stevens feature map</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e3e0;
--planned:#e0e0e6;--deferred:#b8b8bd;--stub:#d9534f;--api-only:#e8a33d;--beta:#4a7fd4;--pending:#36a3a3;--stable:#3a9d5d;
--pass:#3a9d5d;--fail:#d9534f;--partial:#e8a33d;--skip:#9a9aa0}
@media (prefers-color-scheme:dark){:root{--bg:#151517;--card:#1f1f22;--ink:#ececee;--mute:#9a9aa2;--line:#2f2f34}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:18px 24px 8px}h1{margin:0 0 4px;font-size:20px}.sub{color:var(--mute);font-size:13px}
.sub p,.sub ul{margin:2px 0}.sub ul{padding-left:18px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 6px;background:var(--line)}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:2px 10px;cursor:pointer;user-select:none;font-size:12px;color:var(--ink)}
.chip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.chip.off{opacity:.35}
.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:4px 24px 10px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.controls input{padding:6px 10px;border:1px solid var(--line);border-radius:6px;width:260px;background:var(--card);color:var(--ink)}
.group{display:flex;gap:5px;align-items:center}.group b{font-size:12px;color:var(--mute);font-weight:600;margin-right:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;padding:14px 24px 40px}
@media (max-width:1100px){main{grid-template-columns:1fr}}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tab{padding:5px 12px;border-radius:6px;cursor:pointer;border:1px solid var(--line);background:var(--card)}
.tab.on{background:var(--ink);color:var(--bg)}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.area{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.area h2{margin:0;font-size:15px;cursor:pointer}.area h2:hover{text-decoration:underline}
.area .meta{color:var(--mute);font-size:12px;margin:2px 0 6px}
.area .bar{height:8px;margin:6px 0 8px}
.tiles{display:flex;flex-wrap:wrap;gap:4px}
.tile{width:22px;height:22px;border-radius:4px;cursor:pointer;position:relative;border:2px solid transparent}
.tile.notdriven{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.45) 0 3px,transparent 3px 6px)}
.tile.failed::after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--fail);border:1.5px solid var(--card)}
.tile.dim{opacity:.12}.tile.hit{border-color:var(--ink)}.tile.sel{outline:3px solid var(--ink);outline-offset:1px}
.tile:hover{transform:scale(1.15)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
.panel h3{margin:0 0 4px;font-size:16px}.panel h4{margin:14px 0 4px;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;color:#fff;font-size:12px;font-weight:600}
.kv{display:grid;grid-template-columns:90px 1fr;gap:3px 10px;font-size:13px;margin-top:8px}.kv div:nth-child(odd){color:var(--mute)}
code{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(127,127,127,.13);padding:0 3px;border-radius:3px;word-break:break-word}
pre{font:12px ui-monospace,Menlo,monospace;background:rgba(127,127,127,.1);padding:8px;border-radius:6px;overflow:auto;white-space:pre}
.gotcha{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:8px 0;font-size:13px}.gotcha p,.gotcha ul{margin:2px 0}
.gotcha.hit{border-left-color:var(--fail)}.gotcha.near{border-left-color:var(--api-only)}
ul,ol{padding-left:20px;margin:4px 0}
.journeys{display:flex;flex-direction:column;gap:8px}
.journey{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center}
.journey.on{outline:2px solid var(--ink)}.journey .n{color:var(--mute);font-size:12px}
.matrix{border-collapse:collapse;background:var(--card);border-radius:10px;overflow:hidden;width:100%}
.matrix th,.matrix td{border:1px solid var(--line);padding:6px 8px;text-align:center;font-size:13px}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix td.c{cursor:pointer;font-weight:600}
.trow{display:flex;gap:8px;font-size:12px;border-bottom:1px solid var(--line);padding:2px 0}.trow span{flex:1}
.empty{color:var(--mute)}
a.link{color:inherit;cursor:pointer;text-decoration:underline dotted}
</style></head><body>

<script>
const D = {"areas": [{"file": "capture.md", "title": "Capture", "last_verified": "uncommitted on 2026-10-26 (source)", "intro": "<p>Capture stages what Stevens reasons over: Ray-Ban Meta glasses captures (a staged ~90s conference talk, a slide photo, article highlights) into the personal vault, and the fictional Helios deal data (deck photo, CRM record, memos) into the enterprise vault. Day 1 proves both perception gates with live calls; day 2 commits the final fixtures. Overall maturity: everything planned.<\/p>", "subs": [{"id": "capture-talk-audio", "what": "Staged ~90s two-voice talk transcribes via Voice batch with speaker labels and timestamps into the personal vault", "what_text": "Staged ~90s two-voice talk transcribes via Voice batch with speaker labels and timestamps into the personal vault", "maturity": "planned", "surface": "UI+API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md:124, SPEC.md:28", "driving": "<ul><li><b>capture-talk-audio<\/b>: seed then read the transcript \u2192 <code>stevensctl seed &amp;&amp; stevensctl api --as Associate capture talk --expect 200 --field &#x27;.speakers&#x27;<\/code> \u2192 transcript with 2 speakers and timestamp anchors.<\/li><\/ul>", "notes": ""}, {"id": "capture-slide-photo", "what": "Glasses slide photo reads to verbatim text via Spark vision at low effort, stored for Fact checks", "what_text": "Glasses slide photo reads to verbatim text via Spark vision at low effort, stored for Fact checks", "maturity": "planned", "surface": "UI+API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md:124, SPEC.md:28", "driving": "<ul><li><b>capture-slide-photo<\/b>: seed then read the slide text \u2192 <code>stevensctl api --as Associate capture slide --expect 200 --field &#x27;.text&#x27;<\/code> \u2192 verbatim slide text.<\/li><\/ul>", "notes": ""}, {"id": "capture-articles", "what": "3 article highlights land in the personal vault as text claims", "what_text": "3 article highlights land in the personal vault as text claims", "maturity": "planned", "surface": "UI+API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md:124", "driving": "<ul><li><b>capture-articles<\/b>: seed then list personal sources \u2192 <code>stevensctl api --as Associate vault personal --expect 200 --field &#x27;.sources&#x27;<\/code> \u2192 talk, slide, and 3 articles.<\/li><\/ul>", "notes": ""}, {"id": "capture-enterprise", "what": "Helios deal, CRM record, deck photo, team memo, partner-only conflicts memo, and one wall item seed the enterprise vault", "what_text": "Helios deal, CRM record, deck photo, team memo, partner-only conflicts memo, and one wall item seed the enterprise vault", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md:124, SPEC.md:56", "driving": "<ul><li><b>capture-enterprise<\/b>: seed then list enterprise sources \u2192 <code>stevensctl api --as Partner vault enterprise --expect 200 --field &#x27;.sources&#x27;<\/code> \u2192 deal, CRM, deck, memos, and the wall item.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>The Voice endpoint, upload format, and timestamp/speaker response shape are unknown until the day 1 spike, and <code>client.ts<\/code> is designed after it (SPEC.md:116).<\/li><\/ul>", "ids": [], "near": ["capture-articles", "capture-enterprise", "capture-slide-photo", "capture-talk-audio"]}, {"title": "", "html": "<ul><li>Glasses-mic audio of a distant speaker may transcribe poorly; the fallback is phone audio near the speaker with glasses video (SPEC.md:161).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Captures are pre-recorded files, not streamed; live glasses streaming via the Device Access Toolkit is out of scope (SPEC.md:124).<\/li><\/ul>", "ids": [], "near": ["capture-articles", "capture-enterprise", "capture-slide-photo", "capture-talk-audio"]}, {"title": "", "html": "<ul><li>SAM 3.1 screen-cropping is built only if day 1 shows Spark misreads the uncropped photo (SPEC.md:28).<\/li><\/ul>", "ids": [], "near": ["capture-slide-photo", "capture-talk-audio"]}, {"title": "", "html": "<ul><li><code>Source.fixture<\/code> is a <code>public/fixtures/...<\/code> path, never a blob URL, so refresh still works (SPEC.md:56).<\/li><\/ul>", "ids": [], "near": ["capture-enterprise"]}], "how": "<p>Planned UI; no build exists yet. Intended path:<\/p><ol><li>Open the app at <code>http://localhost:5173<\/code>.<\/li><li>Choose \"Capture\".<\/li><li>See the talk transcript appear with speaker labels and timestamps, the slide text, and the vault lists.<\/li><\/ol>", "scope": "Glasses captures and fixtures into the two vaults", "roles": "all", "overall": "planned"}, {"file": "extraction.md", "title": "Extraction", "last_verified": "uncommitted on 2026-10-26 (source)", "intro": "<p>Extraction turns captured text (transcripts, photo text, documents) into structured claims via Spark at low effort with JSON-schema output, and the runtime citation resolver guards everything Stevens displays: every sentence needs a citation, Fact quotes must be verbatim, and failing sentences are dropped and counted. Day 3 build. Overall maturity: everything planned.<\/p>", "subs": [{"id": "extraction-claims", "what": "Transcript and photo text become structured claims (entity, metric, value, verbatim quote, timestamp, speaker)", "what_text": "Transcript and photo text become structured claims (entity, metric, value, verbatim quote, timestamp, speaker)", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md:28, SPEC.md:56", "driving": "<ul><li><b>extraction-claims<\/b>: seed then extract \u2192 <code>stevensctl seed &amp;&amp; stevensctl api --as Associate extract talk --expect 200 --field &#x27;.claims[0].quote&#x27;<\/code> \u2192 claims with verbatim quotes and speaker anchors.< ce)", "intro": "<p>The ledger is the append-only event log in <code>localStorage<\/code> recording the whole pipeline (<code>source.ingested<\/code> through <code>draft.approved<\/code>), with every real model call logging its model, response ID, and usage inside its event. API payloads are cached in their events, so a refresh replays the same brief, answer, and inspector with zero new calls. Day 2 build. Overall maturity: everything planned.<\/p>", "subs": [{"id": "ledger-events", "what": "Every pipeline step appends a typed event; real calls log model, response ID, and usage in theirs", "what_text": "Every pipeline step appends a typed event; real calls log model, response ID, and usage in theirs", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md:46, SPEC.md:56", "driving": "<ul><li><b>ledger-events<\/b>: drive the demo path then read the log \u2192 <code>stevensctl browser run brief &amp;&amp; stevensctl api --as Associate ledger --expect 200 --field &#x27;.events&#x27;<\/code> \u2192 typed events with model, response ID, and usage on real calls.<\/li><\/ul>", "notes": ""}, {"id": "ledger-replay", "what": "A refresh replays the same brief, answer, and inspector from cached payloads with zero new API calls", "what_text": "A refresh replays the same brief, answer, and inspector from cached payloads with zero new API calls", "maturity": "planned", "surface": "UI+API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md:46, SPEC.md:148", "driving": "<ul><li><b>ledger-replay<\/b>: reload and count API calls \u2192 <code>stevensctl meta calls<\/code> before and after a refresh \u2192 counter unchanged, same brief and inspector.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>Model IDs in logged events must appear in <code>GET /v1/models<\/code>, so the 1.3 \u2192 1.2 \u2192 1.1 fallback still validates (SPEC.md:116).<\/li><\/ul>", "ids": [], "near": []}, {"title": "", "html": "<ul><li>Replay is plumbing for reliable recording, not a demo feature (SPEC.md:46).<\/li><\/ul>", "ids": [], "near": ["ledger-events", "ledger-replay"]}, {"title": "", "html": "<ul><li>On a missing key or API error the app uses the cached fixture response with a visible <code>Simulated \u2014 &lt;reason&gt;<\/code> badge (SPEC.md:116).<\/li><\/ul>", "ids": [], "near": []}], "how": "<p>No user path: the ledger is infrastructure. Its visible surface is the inspector and the replay behavior on refresh.<\/p>", "scope": "Append-only event ledger + replay", "roles": "all", "overall": "planned"}, {"file": "boundary.md", "title": "Boundary", "last_verified": "uncommitted on 2026-10-26 (source)", "intro": "<p>The boundary is the enforced mechanism behind both product boundaries: <code>src/boundary/assemble.ts<\/code> is the only path into a model call, applying <code>policy()<\/code> per source for a <code>(purpose, viewerRole)<\/code> pair, building the prompt from allowed claims only, and emitting a <code>Manifest<\/code> of included and withheld sources. Rules live in code, never in prompts. Day 4 build. Overall maturity: everything planned.<\/p>", "subs": [{"id": "boundary-assemble", "what": "The assembler is the only prompt builder; every call emits a Manifest of included and withheld sources", "what_text": "The assembler is the only prompt builder; every call emits a Manifest of included and withheld sources", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md:46, SPEC.md:56", "driving": "<ul><li><b>boundary-assemble<\/b>: assemble an Associate answer call \u2192 <code>stevensctl api --as Associate answer --expect 200 --field &#x27;.manifest.included&#x27;<\/code> \u2192 prompt built from allowed claims with a Manifest.<\/li><\/ul>", "notes": ""}, {"id": "boundary-policy", "what": "Personal is visible to work calls as quotes only; team enterprise is visible; partner-only is signal-only for Associates; wall is excluded for everyone", "what_text": "Personal is visible to work calls as quotes only; team enterprise is visible; partner-only is signal-only for Associates; wall is excluded for everyone", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md:46", "driving": "<ul><li><b>boundary-policy<\/b>: assemble the same call for both roles \u2192 <code>stevensctl api --as Associate answer --field &#x27;.manifest.withheld&#x27;<\/code> then <code>--as Partner<\/code> \u2192 partner memo withheld for the Associate, included for the Partner; wall withheld for both.<\/li><\/ul>", "notes": ""}, {"id": "boundary-websearch", "what": "Web search is off for every call whose manifest includes enterprise data", "what_text": "Web search is off for every call whose manifest includes enterprise data", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md:46", "driving": "<ul><li><b>boundary-websearch<\/b>: check an enterprise call manifest \u2192 <code>stevensctl api --as Associate brief --field &#x27;.manifest.webSearch&#x27;<\/code> \u2192 <code>false<\/code>.<\/li><\/ul>", "notes": ""}, {"id": "boundary-no-writeback", "what": "Nothing in enterprise code paths writes to the personal vault", "what_text": "Nothing in enterprise code paths writes to the personal vault", "maturity": "planned", "surface": "API", "since": "-", "live": "not driven", "live_text": "not driven", "evidence": "SPEC.md:148", "driving": "<ul><li><b>boundary-no-writeback<\/b>: run the full pipeline then diff the personal vault \u2192 <code>stevensctl browser run brief &amp;&amp; stevensctl api --as Associate vault personal --field &#x27;.sources&#x27;<\/code> \u2192 personal sources unchanged.<\/li><\/ul>", "notes": ""}], "gotchas": [{"title": "", "html": "<ul><li>Restricted text never reaches a viewer's prompt: partner-only     ${s.notes ? `<h4>Grade notes</h4>${s.notes}` : ""}
    <h4>How to prove it</h4>${s.driving || `<p class="empty">No "Driving it" bullet names this id.</p>`}
    <h4>Gotchas</h4>${g.map(x => `<div class="gotcha hit">${x.html}</div>`).join("")}
    ${gn.length ? `<div class="n">Cite the same source lines as this row's evidence:</div>` + gn.map(x => `<div class="gotcha near">${x.html}</div>`).join("") : ""}
    ${g.length + gn.length ? "" : `<p class="empty">None tied to this row.</p>`}
    <p><a class="link" data-area="${esc(s.file)}">All ${area.gotchas.length} ${esc(s.area)} gotchas</a></p>
    <h4>Journeys</h4>${js.length ? js.map(j => `<div><a class="link" data-j="${j.id}">${esc(j.name)}</a> ${badge(j.verdict)}</div>`).join("") : `<p class="empty">Not part of a journey.</p>`}`;
}
function panelArea(a) {
  return `<h3>${esc(a.title)}</h3><div class="n">${esc(a.file)} · last verified ${esc(a.last_verified)}</div>
    <div class="bar">${bar(a.subs)}</div>${a.intro}<h4>How to get to it</h4>${a.how}
    <h4>Gotchas (${a.gotchas.length})</h4>${a.gotchas.map(g => `<div class="gotcha">${g.html}</div>`).join("")}`;
}
function panelJourney(j) {
  return `<h3>${esc(j.name)}</h3><div>${badge(j.verdict)} <span class="n">${esc(j.id)} · ${esc(j.areas)} · last live ${esc(j.last)}</span></div><p>${j.result}</p>
    <h4>Touches (${j.ids.length})</h4><div>${j.ids.map(i => `<a class="link" data-id="${i}">${i}</a>`).join(", ")}</div>${j.html}`;
}
function panelHome() {
  const worst = subs.filter(s => s.maturity === "stub" || s.liveState === "failed");
  return `<h3>Start here</h3><p>Tiles are sub-features, colored by maturity. <b>Striped</b>: never driven live. <b>Red dot</b>: a live drive failed. Click an area title for its summary and gotchas, the Journeys tab for cross-area flows, Matrix for counts.</p>
    <h4>Stub or failed live (${worst.length})</h4>${worst.map(s => `<div><a class="link" data-id="${s.id}">${s.id}</a> ${badge(s.maturity)}</div>`).join("")}`;
}
function render() {
  chips($("fmat"), D.maturity, st.mat, m => MCOL[m]);
  chips($("flive"), LIVE, st.live);
  chips($("fsurf"), SURF, st.surf);
  $("tabs").innerHTML = [["map","Map"],["journeys","Journeys"],["matrix","Matrix"]].map(([k,l]) =>
    `<span class="tab ${st.tab === k ? "on" : ""}" data-tab="${k}">${l}</span>`).join("") +
    (st.journey ? `<span class="chip" id="clearj">✕ journey filter: ${esc(st.journey)}</span>` : "");
  $("view").innerHTML = st.tab === "map" ? viewMap() : st.tab === "journeys" ? viewJourneys() : viewMatrix();
  const p = st.panel || {};
  $("panel").innerHTML = p.sub ? panelSub(byId[p.sub]) : p.area ? panelArea(D.areas.find(a => a.file === p.area))
    : p.j ? panelJourney(D.journeys.find(j => j.id === p.j)) : panelHome();
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-id],[data-area],[data-j],[data-tab],[data-area-m],#clearj");
  if (!t) return;
  if (t.id === "clearj") { st.journey = null; }
  else if (t.dataset.tab) st.tab = t.dataset.tab;
  else if (t.dataset.id) { st.sel = t.dataset.id; st.panel = {sub: t.dataset.id}; }
  else if (t.dataset.area) st.panel = {area: t.dataset.area};
  else if (t.dataset.areaM) { const [f, m] = t.dataset.areaM.split("|"); st.mat = new Set([m]); st.tab = "map"; st.panel = {area: f}; }
  else if (t.dataset.j) { st.journey = st.journey === t.dataset.j && st.tab === "journeys" ? null : t.dataset.j; st.panel = {j: t.dataset.j};
    if (t.closest("#panel")) st.tab = "map"; }
  render();
});
$("q").oninput = ev => { st.q = ev.target.value.trim().toLowerCase(); render(); };
header(); render();
</script></body></html>
