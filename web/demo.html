<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stevens · demo harness (dev only)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #14120d; color: #ece6d8; }
  header { padding: 12px 16px; border-bottom: 1px solid #333025; }
  header h1 { margin: 0; font-size: 16px; }
  header p { margin: 4px 0 0; font-size: 12px; color: #a89e8b; }
  .tabs { display: flex; gap: 8px; margin-top: 10px; }
  .tabs button { border: 1px solid #333025; background: #1d1a13; color: #ece6d8; border-radius: 999px; padding: 4px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: #ece6d8; color: #14120d; }
  .screens { display: flex; gap: 8px; padding: 8px; height: calc(100vh - 73px); }
  .screen { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .screen p { margin: 0 0 6px; font-size: 12px; color: #a89e8b; text-align: center; }
  iframe { flex: 1; width: 100%; border: 1px solid #333025; border-radius: 8px; background: #fff; min-height: 0; }
</style>
</head>
<body>
<header>
  <h1>Stevens · demo harness (dev only)</h1>
  <p id="caption">Left: Alex&apos;s laptop (Stevens · yours :5173). Right: Morgan&apos;s laptop (Stevens · firm :5174, signed in as Morgan). Both update live; no clicks run any pipeline.</p>
  <div class="tabs" role="group" aria-label="Scenario">
    <button data-scenario="helios" aria-pressed="true">Helios · Darlington Hall</button>
    <button data-scenario="forge" aria-pressed="false">Forge · staff review</button>
    <button data-scenario="mercy" aria-pressed="false">Mercy · tumor board</button>
  </div>
</header>
<div class="screens">
  <div class="screen">
    <p id="yours-label">Alex&apos;s laptop</p>
    <iframe id="yours" title="Stevens yours" src="http://localhost:5173/#/today"></iframe>
  </div>
  <div class="screen">
    <p id="firm-label">Morgan&apos;s laptop</p>
    <iframe id="firm" title="Stevens firm" src="http://localhost:5174/?as=p-morgan#/inbox"></iframe>
  </div>
</div>
<script>
  var stacks = {
    helios: { yours: 5173, firm: 5174, viewer: 'p-morgan', yoursLabel: "Alex's laptop", firmLabel: "Morgan's laptop" },
    forge: { yours: 5273, firm: 5274, viewer: 'p-theo', yoursLabel: "Rae's laptop", firmLabel: "Theo's laptop" },
    mercy: { yours: 5373, firm: 5374, viewer: 'p-helen', yoursLabel: "Amara's laptop", firmLabel: "Helen's laptop" }
  };
  var buttons = document.querySelectorAll('.tabs button');
  function show(id) {
    var stack = stacks[id];
    document.getElementById('yours').src = 'http://localhost:' + stack.yours + '/#/today';
    document.getElementById('firm').src = 'http://localhost:' + stack.firm + '/?as=' + stack.viewer + '#/inbox';
    document.getElementById('yours-label').textContent = stack.yoursLabel;
    document.getElementById('firm-label').textContent = stack.firmLabel;
    document.getElementById('caption').textContent = 'Scenario ' + id + ': left is Stevens · yours (:' + stack.yours + '), right is Stevens · firm (:' + stack.firm + ', signed in as ' + stack.viewer + '). Both update live; no clicks run any pipeline.';
    buttons.forEach(function (button) { button.setAttribute('aria-pressed', String(button.getAttribute('data-scenario') === id)); });
  }
  buttons.forEach(function (button) {
    button.addEventListener('click', function () { show(button.getAttribute('data-scenario')); });
  });
</script>
</body>
</html>
